
[package]
name = "sokonanoda"
# **版本跟产品走**（2026-10-11 用户拍板）：这里原来写死上游 fork 的 `0.5.0`（"它自己那条线"）
# ⇒ CI 日志里 `Compiling sokonanoda v0.5.0 (crates/kernel)` 被读成"跑的是旧版本" ✗
# —— 内核的**包名**就叫 `sokonanoda`（与 CLI 的**二进制**同名、与 `sokonanoda-cli` 不同包），
# cargo 那行打的是**这个包**的版本，不是产品版本 ✓。
# 现在由 `[workspace.package] version` 单点决定（`scripts/bump.py` 同步 `Cargo.lock`
# 里这一条）；上游出处见 `crates/kernel/README.md` 与下面的 `repository`/`description` ✓。
version.workspace = true
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/intgrah/sokonanoda"
description = "A type checker for the Lean 4 programming language and theorem prover"

[dev-dependencies]
rand = "0.8.5"
num-bigint = { version = "0.4.4", features = ["rand", "serde"] }

[dependencies]
indexmap = "2.13.0"
rustc-hash = "1.1.0"
num-bigint = { version = "0.4.4", features = ["serde"] }
num-integer = "0.1.46"
num-traits = "0.2.17"
semver = "1.0.27"
serde_json = "1.0.111"
serde = { version = "1.0.228", features = ["derive"] }
stumpalo = "0.5.1"
bumpalo = { version = "3.16", features = ["collections"] }
hashbrown = "0.17.1"
smallvec = { version = "1", features = ["union"] }
mimalloc = "0.1.52"
memmap2 = "0.9.11"

[features]
top-byte-ignore = []

[[bin]]
name = "sokonanoda-kernel"
path = "src/main.rs"
bench = false
