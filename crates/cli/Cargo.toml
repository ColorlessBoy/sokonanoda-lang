[package]
name = "sokonanoda-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Command-line front-end for .sokonanoda teaching files"

[[bin]]
name = "sokonanoda"
path = "src/main.rs"

[dependencies]
sokonanoda-front = { path = "../front" }
serde_json = "1"

# lang：教学 crates 的 clippy 严格门禁（kernel 冻结快照不参与）。
[lints.rust]
warnings = "deny"
