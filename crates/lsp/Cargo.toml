[package]
name = "sokonanoda-lsp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Language server for .sokonanoda teaching files"

[[bin]]
name = "sokonanoda-lsp"
path = "src/main.rs"

[dependencies]
sokonanoda-front = { path = "../front" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }
tower-lsp = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
futures = "0.3"
tower = { version = "0.4", features = ["util"] }
tokio = { version = "1", features = ["time", "macros", "rt", "rt-multi-thread"] }

# lang：教学 crates 的 clippy 严格门禁（kernel 冻结快照不参与）。
[lints.rust]
warnings = "deny"
