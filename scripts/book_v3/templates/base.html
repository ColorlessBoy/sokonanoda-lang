<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<link rel="canonical" href="{{CANONICAL}}">
<link rel="stylesheet" href="{{ROOT}}/assets/book-components.css">
<link rel="stylesheet" href="{{ROOT}}/assets/v3.css">
<script defer src="{{ROOT}}/assets/v3.js"></script>
<script type="speculationrules">
{"prefetch":[{"where":{"href_matches":"*.html"},"eagerness":"moderate"}],
 "prerender":[{"where":{"href_matches":"*.html"},"eagerness":"conservative"}]}
</script>
</head>
<body id="top" data-view="both" data-page="{{PAGE_KIND}}">
<a class="skip-link" href="#main">跳过目录，直接读正文</a>
<header class="site-head" role="banner">
  <div class="site-head-inner">
    <a class="brand" href="{{HOME_URL}}">{{BRAND_TITLE}}<span class="brand-sub">{{BRAND_SUB}}</span></a>
    <button class="side-toggle no-print" type="button" aria-expanded="false" aria-controls="site-side" data-side-toggle>单元目录</button>
    <button class="menu-btn no-print" type="button" aria-expanded="false" aria-controls="site-nav" data-menu>菜单</button>
    <nav class="site-nav" id="site-nav" aria-label="站点">
      <span class="book-switch no-print" aria-label="两卷切换">{{BOOK_SWITCH}}</span>
      <form class="top-search no-print" action="{{ROOT}}/search.html" method="get" role="search">
        <span class="search-glyph" aria-hidden="true"><svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="8.5" cy="8.5" r="5.2"></circle><path d="m12.4 12.4 4 4"></path></svg></span>
        <label class="sr-only" for="top-q">搜索全书</label>
        <input id="top-q" name="q" type="search" placeholder="" autocomplete="off">
      </form>
      <a href="{{HOME_URL}}">首页</a>
      <a href="{{ROOT}}/sitemap.html">目录</a>
      <a class="icon-link" href="{{ROOT}}/sitemap.html#print" aria-label="打印 / PDF" title="打印 / PDF"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M7 9V4h10v5"></path><rect x="5" y="9" width="14" height="8" rx="1.5"></rect><path d="M7 14h10v6H7z"></path><circle cx="17" cy="11.5" r=".8" fill="currentColor" stroke="none"></circle></svg></a>
      <span class="head-progress no-print" data-progress-count data-progress-total="{{TOTAL_UNITS}}">已读 0 / {{TOTAL_UNITS}}</span>
    </nav>
  </div>
</header>
<div class="site-shell{{SHELL_CLASS}}">
{{SIDEBAR}}
<div class="site-content">
{{BREADCRUMB}}
<main id="main" class="page {{PAGE_CLASS}}">
{{BODY}}
</main>
<footer class="site-foot">
  <p>{{FOOTER_NOTE}}</p>
  <p><a href="{{ROOT}}/sitemap.html">站点地图</a> · <a href="{{ROOT}}/index.html">返回封面</a></p>
</footer>
</div>
</div>
</body>
</html>
