    #
    # ⭐ **2026-10-15（洞 `PUSH-RANGE-HIDES-RELEASE`，high）：范围不再是"本次推送自己"** ✗。
    # 病根（实测，每一环都有读数 ✓）：paths-filter 在 push 上按 `github.event.before..sha` 算
    # （`src/main.ts:144,168-196` ⇒ `git diff`，`src/git.ts:56`）⇒ **纯 docs 推送把"还没被任何
    # 一轮 CI 验过的祖先"从视野里藏掉** ✗：
    #   · 发版推送 `cb8edd77` 那一轮重活**全排上** ✓（run 38662022022：31 job / 29 success），
    #     但它红在 `ledger (1)`（G-25，00:51:10）**且** 00:56:36 被 cancel ⇒ **没有任何一轮绿过它** ✗；
    #   · 紧随其后的纯 docs 推送（`c11cbc10`，run 38663715016）按**自己的范围**算 ⇒ 三个标志全 false
    #     ✗ ⇒ `gates-fast`/`ledger`/`contract`/`test`/`e2e`/`gates-course` 全 **skipped** ✗
    #     （**19 个 job 只跑 7 个** ✓）⇒ `auto-tag` **从不触发** ✗（它的 `needs` 里有 skipped，
    #     而 skip **沿依赖链传播** —— 机制见本文件 `e2e-ledger` 的注释，2026-09-26 实验证实 ✓）
    #     ⇒ `v0.91.0` 发不出去 ✗（远端 tag 最新仍是 v0.90.0）；
    #   · 同形第二对（更干净）：`84f6233b`（run 38657810157，**9 个 job cancelled**）被 30 秒后的
    #     纯 docs `8e92cd6d`（run 38657859995，**7 success + 12 skipped**）顶掉 ⇒ 那个修复**从未被验证** ✗。
    # **修法 (A)**：基点 = **上一个已验证点**（`scripts/ci-push-range.py` 算，机制/边界见它的文档）——
    # 标记（`actions/cache`，只由 `mark-verified` 在"重活真跑过且全绿"时写 ✓）→ 最近 tag →
    # 仓库根提交；**每一步都朝"更保守"退**，绝不朝"更少验证"退 ✓。
    # 分类**仍然只有一份实现**（下面的 `filters:` ✓）—— 本脚本在 `--explain`/`--selftest` 里
    # **读同一份**做判据，不另立一份 ✗。
    # ⚠ **正对照**（最容易做错的地方 ✗）：连续两次纯 docs 推送**仍不该**跑重活 ✓；
    # 判据 = `python3 scripts/ci-push-range.py --selftest`（含这条 ✓）与 `--check-wiring`（咬接线 ✓），
    # 两者都进了 `wiring-lint` job（**不设 `if:` ⇒ 每推必跑** ✓）与 `scripts/ci-local.sh` ⓪ ✓。
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.f.outputs.rust }}
      editor: ${{ steps.f.outputs.editor }}
      courses: ${{ steps.f.outputs.courses }}
    steps:
      - uses: actions/checkout@v5
      # ① 取回「上一个已验证点」标记（只在 main 的 push 上；PR 走 paths-filter 自己的 PR 分支 ✓）。
      # ⚠ `key` 故意用一个**永不精确命中**的值 ⇒ 走 `restore-keys` 前缀匹配 = **最近创建的那个** ✓
      # （每个标记的 key 带 `run_id` ⇒ 唯一 ✓，不会被"已存在"挡住 ✗）。
      - name: 取回已验证点标记（上一个"重活全绿"的 sha）
        id: verified
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/restore@v4
        with:
          path: .ci-verified
          key: ci-verified-marker-restore-only-${{ github.run_id }}
          restore-keys: |
            ci-verified-marker-
      # ② 算基点（**唯一实现** = `scripts/ci-push-range.py` ✓；它同时打印三组读数，给第 ④ 步对账 ✓）
      - name: 算推送范围基点（上一个已验证点，而不是"上一次推送"）
        id: base
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python3 scripts/ci-push-range.py --before "${{ github.event.before }}" >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@v4
        id: f
        with:
          # ③ 把基点交给它（它的 `base` 入参 ✓，`src/main.ts:32`）：40 位 sha ⇒ `git.getChanges(base, head)`
          # ✓；**空值 = PR / 首推** ⇒ 走它自己的事件分支（PR 用 base 分支 ✓、首推用 NULL_SHA 全 added ✓）
          # ⇒ 那两条路径的**原行为逐字不变** ✓。
          base: ${{ steps.base.outputs.base }}
          filters: |
            rust:
              - "crates/**"
              - "Cargo.toml"
              - "Cargo.lock"
              # **scripts/** 也算"会改变验证结果"** ✓（2026-09-25 ✓ 我自己的过滤器漏洞 ✗）：
              # 改 `scripts/gap.py` / `audit-*.py` / `ci-local.sh` **必须**触发
              # `gates`/`ledger`/`contract` ✓ —— 否则"改了判据却没人验" ✗，
              # 正是用户抱怨的那种形态 ✓。
              - "scripts/**"
              # **改 CI 自身也要跑**（2026-09-25 round 161 ✓ 我自己撞上的洞 ✗）：
              # 只改 `.github/workflows/**` 时，三个标志全 false ✗ ⇒ `ledger`/`gates`/`test`
              # 全被 skip ✗ ⇒ **刚改的那条 job 永远得不到验证** ✓（本轮修 `ledger` 的 Node
              # 就是这么被 skip 掉的 ✗）。⇒ 把工作流文件也算进"会改变验证结果" ✓。
              - ".github/workflows/**"
              # **docs/gaps/** 也算"会改变验证结果"** ✓（2026-10-11 ✓ —— **第三次**同形洞 ✗，
              # 前两次是 `scripts/**` 与 `.github/workflows/**`，见上两条）。复现件与台账都在
              # `docs/gaps/**`，而 `ledger` 的 `if` 只看 `rust`/`courses` ⇒ **只改复现件**时三个
              # 标志全 false ✗ ⇒ `ledger` 被 skip ✗ ⇒ **刚修好的那条复现件永远得不到验证** ✗。
              # 实测（G-110）：写死本机路径的复现件**本机必绿**、只有 CI 判「环境异常」✗；
              # 而**修好它的那次 push 反而什么都没跑** ✗ —— 正是用户抱怨的那种形态 ✓。
              - "docs/gaps/**"
              # ⭐ **`editor/vscode/scripts/**` 也算"会改变验证结果"** ✓
              # （2026-10-15 —— 同族**第五次**，由新的**类守卫**
              #  `scripts/check-ci-wiring.py`（层①）**自己找出来的** ✓，不是人撞上的 ✓）。
              # 实测：`ledger` job 的「Stage bundled CLI + LSP for the extension repros」
              # 那一步跑 `node editor/vscode/scripts/stage-lsp.js`（**它消费这个脚本** ✓），
              # 而 `ledger` 的 `if` 只看 `rust`/`courses` ⇒ **只改这个脚本**时三个标志全 false
              # ✗ ⇒ `ledger` 被 skip ✗ ⇒ **刚改的暂存逻辑永远得不到验证** ✗。
              # 归到 `rust` 的理由与 `scripts/**` 那条**逐字相同**：它是"会改变验证结果的脚本" ✓。
              - "editor/vscode/scripts/**"
            editor:
              - "editor/**"
            courses:
              - "courses/**"
              - "playground.sokonanoda"
              # ⭐ **`examples/**` 也算课程语料** ✓（2026-10-15 —— 同族**第六次**，
              # 同样是类守卫找出来的 ✓）。实测：`gates-fast` 的
              # 「Lesson corpus is valid」那一步 `for f in examples/*.sokonanoda` 逐个判卷
              # （**它消费这个目录** ✓），而 `gates-fast` 的 `if` 只看 `rust`/`courses`
              # ⇒ **只改样例**时三个标志全 false ✗ ⇒ 那条语料判据被 skip ✗。
              # 归到 `courses` 的理由与 `playground.sokonanoda` 那条**逐字相同**：
              # 它就是课程语料 ✓（且比塞进 `rust` 便宜 —— 不会顺带拉起 4 路 crate 矩阵 ✓）。
              - "examples/**"
      # ④ **接缝对账**（验证设计纪律 ③ ✓）：本脚本（可本地单测的那份 ✓）的读数 vs paths-filter
      # 的读数。**危险方向**（脚本说该跑重活、它说干净 ⇒ 洞还在 ✗）**判红** ✗；
      # 安全方向（脚本干净、它说脏 ⇒ 只是多跑）只 `::warning::` ✓ —— 不制造假红 ✓。
      - name: 对账（范围读数 vs paths-filter 读数）
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SOKO_RANGE_RUST: ${{ steps.base.outputs.rust }}
          SOKO_RANGE_COURSES: ${{ steps.base.outputs.courses }}
          SOKO_RANGE_EDITOR: ${{ steps.base.outputs.editor }}
          SOKO_DORNY_RUST: ${{ steps.f.outputs.rust }}
          SOKO_DORNY_COURSES: ${{ steps.f.outputs.courses }}
          SOKO_DORNY_EDITOR: ${{ steps.f.outputs.editor }}
        run: python3 scripts/ci-push-range.py --cross-check

  # ⭐ **记下「已验证点」**（2026-10-15，`PUSH-RANGE-HIDES-RELEASE` 的另一半 ✓）：
  # **只有"重活真跑过且全绿"的那一轮**才把标记推进到本 sha ✓；纯 docs 轮（重活全 skipped）
  # **不推进** ✗ ⇒ 下一次 `changes` 从"上一个已验证点"算范围 ⇒ **未验证的祖先不会被藏掉** ✓，
  # 而**连续两次纯 docs 仍不跑重活** ✓（正对照，判据在 `--selftest` 里 ✓）。
  # ⚠ `if` **必须**带状态函数 `always()` ✗✓（2026-09-26 实验：`needs` 里有 skipped ⇒ 本 job 被
  # 拖成 skipped ✗，机制见 `e2e-ledger` 的注释 ✓）—— 这里**正是**要它在"有 skipped 依赖"时也求值 ✓。
  # ⚠ `perf-gate` **故意不在 `needs` 里** ✓：它是"只报不拦"（`continue-on-error: true`）⇒
  # 让它拦住标记会把"性能只报"变成"验证点不推进" ✗。
  # ⚠ **不**进 `auto-tag` 的 `needs` ✗：标记是**旁路记账**，不许有能力挡住发版 ✓。
  mark-verified:
    name: mark-verified（重活真跑过且全绿 ⇒ 推进「已验证点」标记）
    needs: [changes, lint-fmt, lint-clippy, board, guard-bite, budgets, site, hygiene, test, gates-fast, gates-course, ledger, contract, editor, e2e, e2e-macos]
    if: >-
      always()
      && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
      && (needs.changes.outputs.rust == 'true' || needs.changes.outputs.courses == 'true' || needs.changes.outputs.editor == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # **审计留痕**：把 needs 的结论逐条打出来 —— 标记"验证过什么"必须可回看 ✓
      #（「有就渲染」是反模式的反面：这里把依据**显式**写进日志 ✓）。
      - name: 记下这一轮真验了什么 + 写标记
        env:
          SOKO_NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          python3 -c 'import json,os; d=json.loads(os.environ["SOKO_NEEDS"]); print("needs 结论：", {k: v["result"] for k, v in d.items()})'
          mkdir -p .ci-verified
          printf '%s\n' "${GITHUB_SHA}" > .ci-verified/sha
          echo "已验证点 → ${GITHUB_SHA}（rust=${{ needs.changes.outputs.rust }} · courses=${{ needs.changes.outputs.courses }} · editor=${{ needs.changes.outputs.editor }}）"
      # key 唯一（带 run_id ✓）⇒ 每轮一个新条目；`changes` 的 restore-keys 取**最近创建**的那个 ✓。
      - name: 存标记
        uses: actions/cache/save@v4
        with:
          path: .ci-verified
          key: ci-verified-marker-${{ github.sha }}-${{ github.run_id }}

  test:
    needs: [changes, lint-fmt, lint-clippy, gates-fast]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # **按 crate 的 4 路矩阵**（2026-09-25 用户要求 ✓："能尽可能细吗？现在 github action
    # 过于阻碍开发进度了" ✓）：一条 `cargo test --workspace` 在 CI 上 ~19 分钟 ✗ ⇒ 拆四路并排 ✓
    # ⇒ 单条 ~5 分钟 ✓、**失败直接指名哪个 crate** ✓（改 front 不必等 cli 的测试 ✓）。
    strategy:
      fail-fast: false
      matrix:
        pkg: [sokonanoda, sokonanoda-front, sokonanoda-cli, sokonanoda-lsp]
        # **按"测试种类"再分片**（2026-09-25 用户第 ⑤ 条 ✓）：4 个 crate 的耗时
        # 实测相当均衡（7m39s / 8m27s / 10m41s / 9m12s）=> 按 crate 再拆没有空间；
        # 而 `--lib` / `--tests` / `--doc` 是**互不重叠**的三块 =>
        # 拆开后最长杆从 ~10m41s 降到 ~4 分钟，且**输出格式不变**（注解步骤照旧有效）。
        # ⚠ 不用 `cargo nextest`：它**不跑 doctest**，且输出格式会打断既有的失败注解。
        kind: [lib, tests, doc]
        # **`sokonanoda-cli` 是纯 bin crate** ✓ ⇒ 它的 `--lib` / `--doc` 腿**永远红** ✗
        # （`error: no library targets found in package sokonanoda-cli` ✓）
        # ⇒ 2026-09-25 起**排除这两条** ✓（12 条腿 → **10 条** ✓）。
        # ⚠ 为什么重要 ✓：`auto-tag` 的 `needs` 里有 `test` ✓ ⇒ 这两条红腿
        # **会挡住发版** ✗（实测 ✓：`0.72.0` 因此一直发不出去 ✓）。
        exclude:
          - pkg: sokonanoda-cli
            kind: lib
          - pkg: sokonanoda-cli
            kind: doc
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Workspace tests
        # tee 保留完整输出；--no-fail-fast 让所有失败一次暴露。
        # 失败时把完整日志作为 artifact 上传（公开仓库也能从 run 页下载），
        # 避免「CI 红了但拿不到日志」的排查死角（2026-09-13 实况）。
        shell: bash
        # 步骤级也有上限 ✓ ⇒ 卡住时能**指名是哪一步** ✓（job 级上限只给"失败"✗）。
        timeout-minutes: 35
        run: |
          set -o pipefail
          case "${{ matrix.kind }}" in
            lib)   flag=--lib ;;
            tests) flag=--tests ;;
            doc)   flag=--doc ;;
          esac
          cargo test -p ${{ matrix.pkg }} $flag --locked --no-fail-fast 2>&1 | tee /tmp/cargo-test.log
      - name: Per-suite timing (always)
        # **分套回显**（2026-09-25 补 ✓）：一条 `cargo test --workspace` 是一大块 ✗，
        # 慢在哪一套看不出来 ✓ ⇒ 把每套的 `test result:` 行列出来 ✓（含耗时 ✓）。
        if: always()
        shell: bash
        run: |
          echo "=== 每套测试的结果与耗时 ==="
          grep -E "^(test result:|running [0-9]+ tests?|     Running)" /tmp/cargo-test.log || echo "(没有日志 ✗ —— 说明卡在上一步之前)"
          echo "=== 最慢的 10 套（按耗时排序）==="
          grep -E "^test result:" /tmp/cargo-test.log | sed -E 's/.*finished in ([0-9.]+)s.*/\1 &/' | sort -rn | head -10 || true
      # 注解走 check-runs API，**无需鉴权即可公开读取**（logs/artifact 都要
      # token）——这是无 gh/token 环境下唯一的自服务诊断通道。
      - name: Surface failing tests as annotations
        if: failure()
        shell: bash
        run: |
          grep -E "^test .* FAILED$" /tmp/cargo-test.log | while read -r line; do
            echo "::error::$line"
          done
          grep -E "^error(\[E[0-9]+\])?:" /tmp/cargo-test.log | head -20 | while read -r line; do
            echo "::error::$line"
          done
      - name: Upload test log (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cargo-test-log
          path: /tmp/cargo-test.log
          include-hidden-files: false
      - name: Protocol conformance (--json events)
        run: cargo test -p sokonanoda-cli --test protocol --locked

      # 性能例行化（I13-S5c）：每次 push 产出性能报告 artifact——阈值断言
      # 已在上面 Workspace tests 里把红（回归即失败），这一步额外留档：
      # 报告带版本 + commit SHA，按版本可追溯「哪个改动引入了性能回退」。
      - name: Performance report
        # **调用同一个脚本**，不在这里复制粘贴命令：口径（`--test-threads=1`、
        # best-of-N、跑哪些套件）只能有一份真相。以前这里漏了 `--test-threads=1`，
        # 与本地/台账的串行口径不一致；而且新增套件（如 `perf_course`）得手改两处。
        run: |
          set -o pipefail
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          out="perf-report-v${version}-$(git rev-parse --short HEAD).txt"
          scripts/perf-report.sh "$out"
      - name: Upload perf report
        uses: actions/upload-artifact@v7
        with:
          name: perf-report
          path: perf-report-*.txt
          include-hidden-files: false

  # ── T-E1：性能 smoke 门禁（2026-09-25 ✓）────────────────────────────────
  # **为什么**：`perf-report` job 只**报**不**拦** ✗ ⇒ 性能退化没人发现 ✗。
  # T-E1 的原文是"把三个基准做成 CI 可跑的 smoke ✓（阈值宽松 ✓，只抓**大幅退化** ✗）"。
  # **复用现成机制** ✓（不新建 ✗）：`scripts/perf-check.sh` 已有退出码语义 ✓
  # （0=无退化 ✓ / **1=超阈值** ✓ / 2=用法错 ✓）与口径 ✓（一律 `--test-threads=1` ✓、
  # 优先比 `best_ms` ✓），`scripts/perf-compare.py` 已有**噪声地板** ✓（`floor_ms=5.0` ✓）。
  # **smoke 子集**（~1 秒 ✓，2026-09-25 round 312 实测 ✓）：全部 `front-project` 四条 ✓
  # + `lsp-course did_open_same_session`（134ms ✓ —— **正是 D-1/D-2 动过的那条热路径** ✓）
  # + `keystroke`（504ms ✓）。**排除重条** ✓（`did_open` 的 1.9/4.6/9.1s ✗ 与
  # `cli-project` 的 release 构建 ✗）⇒ 它们仍由 `perf-report` **只报不拦** 覆盖 ✓。
  # ⚠ **第一轮 `continue-on-error: true`（只报不拦 ✓）**：CI runner 比本地吵 ✗
  # ⇒ **必须先量一次 CI 上的抖动** ✓ ⇒ 再定阈值 ✓ ⇒ 再转成拦 ✓
  # （**门禁假红比没有门禁更糟** ✗）。
  perf-gate:
    # ⚠ **回退为"只报不拦"**（2026-09-29，**判红一轮后按实测回退**）。
    #
    # **为什么判红不行**（实测）：撤掉 `continue-on-error` 后第一轮就 **failure** ✗ ——
    # 而**同一段代码本地跑同一个序列 5 个 case 全 exit 0**（本地复现不出来）。
    # 根因是**共享 CI runner 上的墙钟抖动**：同一套件实测**本机 37.37s vs CI 278.58s**
    # （7.5×），而 `--threshold 50` 是**绝对百分比** ⇒ 挡不住这种量级的抖动
    # （`AGENTS.md` 的 perf-gate 教训原文：「调到多大都追不上机器差」）。
    # 上一轮加的"同 runner 家族基线"解决了**跨宿主比较**（那是对的 ✓，保留），
    # 但**没解决同一 runner 家族内部的 run-to-run 抖动** ⇒ 判红会**假红**。
    # 「**门禁假红比没有门禁更糟**」（本 job 原注释的原话）⇒ 回退 ✓。
    #
    # **真正的拦截在哪**（不是"就不拦了"）：
    # `gates-fast` 的 **`scripts/check-recompile-factor.py`**（**测次数、不测耗时**）——
    # 它**已经判红**（`gates-fast` 无 `continue-on-error`），而且**噪声免疫**
    # （`by_calls` 是结构计数，与机器快慢无关）。G-68 的正解就归它守 ✓。
    # ⇒ **能拦的用计数拦（已拦），拦不住的（墙钟）只报** —— 这是本轮实测得出的分工 ✓。
    name: perf-gate（性能 smoke，只报不拦；计数守卫在 gates-fast 判红）
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      # **同 runner 家族的基线**（跨 run 持久）：仓库台账只有 Darwin ⇒ CI 拿不到
      # 可比基线 ⇒ 这条缓存就是 CI 的"台账" ✓（key 带 runner 标签，别跨 runner 家族混）。
      - name: Restore perf baseline（同 runner 家族）
        uses: actions/cache/restore@v4
        with:
          path: .perf-baseline.jsonl
          key: perf-baseline-${{ runner.os }}-${{ runner.arch }}-${{ github.base_ref || github.ref_name }}
          restore-keys: |
            perf-baseline-${{ runner.os }}-${{ runner.arch }}-
      - name: Perf smoke（对比同 runner 基线；阈值 50%）
        # `--threshold 50` = **比默认 25% 更松** ✓（T-E1 要求"阈值宽松 ✓"）
        # ⇒ CI runner 的抖动比本地大 ✗，宽松阈值只抓**大幅退化** ✓。
        env:
          SOKO_PERF_LEDGER: .perf-baseline.jsonl
        run: |
          # ⚠ **`--case` 是"测试名子串"** ✗ —— **不是**台账里的 `(scope, case)` 名 ✗
          # （2026-09-25 round 313 实测 ✓：拿台账名当过滤器 ⇒ **5 个里 3 个 exit=2** ✗
          #  = "没跑到任何 case" ⇒ **守卫空转** ✗）。下面用**真实测试名子串** ✓：
          # `perf_course_did_open_is_recorded` ✓ 一条覆盖台账四条 ✓：
          # `did_open` 的 1905/4644/9085ms **与** `did_open_same_session` 的 **134ms** ✓
          # —— 后者正是 **D-1/D-2 动过的那条热路径** ✓（"同一会话里再判一次" ✓）。
          # 没有基线文件 ⇒ 先建一个空台账（否则 perf-check 的 --list 段会报错）。
          [ -f .perf-baseline.jsonl ] || : > .perf-baseline.jsonl
          failed=0
          for case in judge_prefix_with_imported \
                      keystroke_recompiles_the_closure \
                      teaching_scale_keystroke \
                      keystroke \
                      perf_course_did_open_is_recorded; do
            echo "── perf smoke: $case"
            # **只报不拦**（见 job 头的实测理由）：退化仍然**打出来**，但不当失败。
            scripts/perf-check.sh --case "$case" --threshold 50 || true
          done
      - name: Record perf baseline（仅 main，把本轮数字写进缓存文件）
        if: github.ref == 'refs/heads/main'
        env:
          SOKO_PERF_LEDGER: .perf-baseline.jsonl
        run: |
          for case in judge_prefix_with_imported \
                      keystroke_recompiles_the_closure \
                      teaching_scale_keystroke \
                      keystroke \
                      perf_course_did_open_is_recorded; do
            scripts/perf-check.sh --case "$case" --threshold 100000 \
              --emit-records .perf-baseline.jsonl >/dev/null 2>&1 || true
          done
          echo "baseline 现在有 $(wc -l < .perf-baseline.jsonl) 条记录"
      - name: Persist perf baseline（仅 main）
        # 基线**只在 `main` 上更新** ⇒ PR 比的永远是"已合并的代码" ✓。
        # 用 `--emit-records` 把上面那一轮的数字追加进缓存文件 ✓。
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: .perf-baseline.jsonl
          key: perf-baseline-${{ runner.os }}-${{ runner.arch }}-${{ github.ref_name }}-${{ github.run_id }}

  gates-fast:
    name: gates-fast（课程语料 + 契约，debug 路径）
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.courses == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # **拆成两条并行路径**（2026-09-25 用户要求 ✓："gates 要跑 16 分钟…完全阻碍了前期开发" ✓）：
    # 原来一条 job 串起 **debug 路径**（语料 `cargo run` + 契约 `cargo test`）与
    # **release 路径**（`cargo build --release` + 课程门禁 ✓）⇒ 墙钟 = **两段之和** ✗；
    # 拆开后 = **两段的最大值** ✓（两者互不依赖 ✓）。
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Lesson corpus is valid
        # **一次构建 + N 次直调**（2026-09-25 round 192 ✓，方案 ② ✓）：
        # 原来把 `cargo run` 写在**循环里** ✗ ⇒ 每个样例都重新过一次 cargo ✓
        # （检查新鲜度 + 起进程 ✓）⇒ 语料一多就线性变慢 ✗。
        # `cargo run` 在循环外跑**一次** ✓，循环里直接调二进制 ✓ ⇒ 去掉固定开销 ✓。
        run: |
          cargo build -q -p sokonanoda-cli --locked
          bin=target/debug/sokonanoda
          for f in examples/*.sokonanoda; do
            echo "checking $f"
            "$bin" "$f" >/dev/null
          done
      - name: Timing evidence is checked (E18)
        # **E18**（用户 D10：「**干等一个后台任务 30 分钟，还是黑箱**……后续完全没有
        # 优化的可能」）⇒ 把那条**文字纪律**变成**可判红的东西** ✓：
        # 动了**内核源码**、或 subject **自称 perf** 的提交，commit message 里**必须有
        # 实测计时数字**（或显式豁免 `soko:no-timing: <理由>`）✗⇒判红 ✓。
        # ⚠ 范围是**实测收窄过的**（见脚本头注释）：第一版把整个 `crates/*/` 都算敏感 ⇒
        # 拿真实历史跑出 **11 个假阳性**（含 CI 自动的 `perf(e2e): 台账 …`）✗ ——
        # 守卫一旦那么宽，正确的反应就变成"加豁免"，那它就死了 ✓。
        # 这里只跑**自检**（反例必须判红 ⇒ 守卫没空转 ✓）；区间判定在 pre-push 里做
        # （CI 里 `HEAD~1..HEAD` 对 merge 提交不等于"这一推的提交" ✗）。
        run: python3 scripts/check-timing-evidence.py --selftest
      - name: Recompiled work is counted, not timed (G-68)
        # **测次数，不测耗时** ✓（2026-09-28 用户 22:09「重复编译这种灾难怎么会发生」）：
        # 既有性能门禁全是**相对量**（`perf-gate` 比台账上一次同名记录的 delta、
        # E17 按"每声明"归一）⇒ **基线里已经包含的浪费在定义上不可见** ✗ ——
        # per-entry-closure 键让共享依赖在每个入口里各编一遍（实测 **174 次模块编译
        # = 4.14×**、rebuild **222.1s**），而它在 0.68.0→0.78.0 每个版本都是同一个
        # 常数 ⇒ 恒定 0% delta、归一化后 44.9 → 44.9 ms ✓✓。
        # 夹具 = 3 个入口共享 1 个依赖；判据 = `SOKO_STAGE_STATS` 的 `by_calls`
        # （"共享依赖被编了几次"的直接读数）≤ `scripts/recompile-budget.json` 的上界
        # （**只许减不许增**）。`--selftest` = 反向验证：5 入口的重复场景必须判红。
        # 二进制：上一 step 刚 `cargo build` 出的 `target/debug/sokonanoda`
        # （守卫测的是**结构计数**，与 debug/release 无关）。
        # 复盘：docs/perf/recompile-waste-retrospective-2026-09-28.md
        run: |
          python3 scripts/check-recompile-factor.py
          python3 scripts/check-recompile-factor.py --selftest
      - name: Test files that set env must hold exactly one #[test]
        # **环境档位隔离**（2026-09-30 事故）：`SOKO_JUDGE_INPLACE*` 走 `OnceLock`
        # 只读一次环境，而**同一文件的多个 `#[test]` 共享一个进程** ⇒ 两条判据
        # 抢同一个档位 ⇒ **间歇判红**（实测 6 连跑 4 红 2 绿；症状是"单独跑绿、
        # gate 里红"）。判据 = 配 `env::set_var` 的集成测试文件**必须恰好一个
        # `#[test]`**（一个档位一个文件 = 独立进程 ✓）。
        # `--selftest` = 反向验证：两个 test 的夹具**必须判红**。
        run: |
          python3 scripts/check-test-env-isolation.py
          python3 scripts/check-test-env-isolation.py --selftest
      - name: Progress events never go quiet for long (P2 · 机器通道 · `--layer gap`)
        # **量事件流最长空档**（不是"有没有进度条" ✗）：`build.decl` 声明级 +
        # `build.tick` 心跳（≤1/s，只报已用时、不假装百分比）两条通道 ⇒ ≤ 2.5s。
        # 改前实测冷编课程 **39.0s**（`unit08-solution`），≥5s 的空档占整轮 80%。
        # `--selftest` = 反向验证：合成一段 5s 空档**必须判红**。
        # 2026-10-17 第 7 轮 `gs7`：与下面那条（人看通道）合并成 `check-progress.py`
        # ⇒ **接线点一律点名层**（`--layer gap`）⇒ 一条红只属于一层 ✓。
        run: |
          python3 scripts/check-progress.py --layer gap
          python3 scripts/check-progress.py --layer gap --selftest
      - name: Human-facing build progress is per-file and never goes quiet (C1 · 人看通道 · `--layer cadence`)
        # **量人看的那条**（stderr）：`--layer gap` 只看 `--json` 的事件流
        # （机器通道）⇒ 看不见它 ✗。判据：N=120 个文件 ⇒ 人看的进度行 **≥ N**
        # （旧的是每 10% ⇒ 10 行 = 用户报的"约 24 个文件才一条" ✗）+ 人话心跳 ≥2 条。
        # `--selftest` = 反向验证：合成"每 24 个一行"的流**必须判红**。
        run: |
          python3 scripts/check-progress.py --layer cadence
          python3 scripts/check-progress.py --layer cadence --selftest
      - name: Course layer is guarded (canvases, solutions, course.json)
        run: cargo test -p sokonanoda-cli --test course --locked
  gates-course:
    # ⚠ **分片试过、实测无效 ⇒ 已回退**（2026-09-29，用户 14:45「如果分片没用那就改回去」）：
    # 曾做成 4 片矩阵（`check.py --shard i/N`），但**决定性测量**否掉了它 ——
    # 单片冷跑 **317.71s** ≈ 全量 **313.78s**（期望 ~78s）✗。
    # **为什么无效**：门禁对**每个目标**跑一次 `grade`，每次都把该目标的 import 闭包
    # **从零编一遍** ⇒ 分片切的是"**目标数**"，切不掉"**共享 `lib/*` 闭包的重复编译**"。
    # ⇒ 这与 judge 重跑前缀是**同一个病**（§18：`judge` 占 88%）⇒ 修那个才是大头 ✓。
    # **保留**（与本刀无关的真收益）：① 课程产物缓存（冷 313.8s → 热 0.50s，**628×**）；
    # ② `ci-green.py --selftest` 的夹具漂移修复（真 bug）。
    name: gates-course（release 构建 + 课程门禁）
    needs: [changes, lint-fmt, lint-clippy, gates-fast]
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.courses == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Setup Node for the course gate
        # 课程门禁的判据在 courses/set-theory/tools/check.py（python3）；判卷通道是
        # `grade`（node 启动器解析二进制，或直接用下面给的当轮二进制）。
        # 显式钉 node 22（与 editor 集成测试同口径），不用 runner 的默认版本。
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # 课程门禁（卷 I《集合论》）：判据 G1–G5，**与规模无关**（不锁计数——课程还在长）。
      # 唯一真相是课程自己的 check.py（硬规则 6：课程线零 cargo），它内部只认
      # `grade` 的退出码（G-10）、一律绝对路径（G-12）、失败时给不依赖 span 的
      # `--bisect`（G-15）。--selftest 先跑：故意坏的单元必须被判负，判据通道失效时
      # 这一步自己红。
      #
      # 二进制用**当轮 cargo 刚编出来的 release**：版本天然一致、零下载
      # （`scripts/soko setup` 在版本 bump 的 main push 上必然 404），而且它才是
      # **发布形态**——debug 二进制判同一份课程要慢一倍（实测 190s vs 93s，
      # 卷 I 单元⑫ 的解答），2026-09-21 `35516857130` 就是被这个差额顶穿
      # 单目标 180s 上限的。profile 显示两边做的是同样的工作，纯粹是优化等级，
      # 所以"用 release 判"既更快也更忠实；根因（`by` 块每走一步 tactic 都要
      # 重新判定整份文档 ⇒ 代价随文件超线性）记在 STATUS.md 的未做项与
      # `docs/design/site-single-page.md` §2 的"未来的计划"里，**尚未进缺口台账**
      # （要进就得配一条 CI 预算内的确定性复现，别为了凑格式塞一条跑不动的）。
      # 为什么是 test job 里的一个 step 而不是独立 job：见
      # docs/design/course-gate-in-ci.md §2（独立 job 要么自己再编一份 Rust、要么
      # 下载还不存在的 release，且很容易漏进 auto-tag 的 needs ⇒ 假绿发布）。
      #
      # **超时按实测标定**（2026-09-21：`35512977249` 被 5 分钟掐死；改成 20 分钟后
      # `35516857130` 暴露出真正的瓶颈是单目标 180s 上限而不是总时长）。release
      # 二进制下整卷门禁本机约 2.5 分钟、runner ≈ ×2 ⇒ 5 分钟量级，20 分钟留 4× 余量。
      # 课程会长大、判卷成本随之上升，这个数要跟着实测走。
      - name: Release CLI for the course gate
        # release profile 的依赖在上面的 perf report 步（`--release ... perf_project`）
        # 已经编好，这一步只补 `--bin sokonanoda` 这一个目标。
        run: cargo build --release -p sokonanoda-cli --locked
      # ── 课程产物的**内容寻址缓存**（2026-09-29 用户要求 ✓）────────────────────
      # **为什么值得**：门禁对**每个目标**跑一次 `grade`，每次都把该目标的 import
      # 闭包**冷编译**一遍 ⇒ 成本随课程规模线性涨。实测：**本机（M 系）5 分 05 秒 ·
      # CI 2 核 ubuntu 19 分 22 秒（≈3.8×）**；而本机**热缓存 0.5 秒**（59 MB 产物）
      # ⇒ **100× 级**，比任何并行都值 ✓（这段本来写在下面的注释里"留到 0.78 单独一轮"，
      # **现在就是那一轮** ✓）。
      #
      # **键含课程源码哈希**（`courses/set-theory/**` + `tools/check.py`）⇒ 源码一变
      # 键就变 ⇒ **不会拿旧产物判新课程** ✓（用户红线："错判比慢严重"）。
      # ⚠ **故意不给 `restore-keys` 兜底**：要兜底就得容忍"部分旧产物"，那正是
      # "缓存污染"这一新失败模式的入口。**精确命中或全冷** ⇒ 语义最干净 ✓。
      # 产物本身还是**内容寻址**的（`<模块根>/.sokonanoda/compiled/`，键含源文本 +
      # 依赖闭包）⇒ 即使命中了不该命中的条目，也只会**重编**、不会错判 ✓。
      - name: Restore course artifacts（内容寻址缓存）
        id: course-cache
        uses: actions/cache/restore@v4
        with:
          path: courses/set-theory/.sokonanoda
          key: course-artifacts-${{ runner.os }}-${{ hashFiles('courses/set-theory/**', 'courses/set-theory/tools/check.py') }}
      - name: Course artifacts（冷启动时说明一句；命中/未命中都可见）
        # 只做**可观测性**：让人在日志里一眼看出这次是冷是热（缓存是否命中）。
        shell: bash
        run: |
          if [ -d courses/set-theory/.sokonanoda/compiled ]; then
            echo "course artifacts present"
            du -sh courses/set-theory/.sokonanoda
          else
            echo "course artifacts absent"
          fi
      - name: Course gate (set-theory, G1–G5)
        # **上限 20 → 40 分钟**（2026-09-28，v0.77.0 发版轮实测 ✓）：
        # 本步在 CI 上**跑完了且结果正确**（`43 个目标 —— 375 checked · 99 open ·
        # 0 个被判负` ✓），只是**顶到 20 分钟上限被杀**（日志：`##[error]The action
        # 'Course gate (set-theory, G1–G5)' has timed out after 20 minutes`）。
        # **为什么 CI 比本机贵**（同一条命令、同一个 release 二进制 ✓）：
        # 课程门禁对**每个目标**跑一次 `grade <绝对路径> --json`，而每次都要把该目标
        # 的 import 闭包**冷编译**一遍 ⇒ 成本随课程规模线性涨。v0.77.0 新增 6 个
        # `lib/*.sokonanoda` 模块（`Ordinal`/`Cardinal`/`Choice`/`ZF`/`Extensionality`/
        # `Sum`）+ 大量引理 ⇒ 课程从 331 checked 涨到 375。
        # 实测：**本机（M 系 mac，release）5 分 05 秒冷跑**，CI 是 2 核 ubuntu
        # ⇒ **19 分 22 秒**（≈3.8×，与既有跨机器倍数一致；`docs/PERF.md` 记过同一现象）。
        # ⚠ **这不是"判据变慢"**：门禁的**判据没动**（G1–G5 一条没改 ✓）、课程难度没降 ✓。
        # 按仓库先例取 40 分钟（与 `ledger` 的 30 分钟同族；给 2× 余量）✓。
        # **后续优化**（不阻塞本版）：给 `<模块根>/.sokonanoda/compiled/` 加 `actions/cache`
        # —— 本机实测**热缓存 0.5 秒**（59 MB 产物）⇒ 值得做，但它引入"缓存失效/污染"
        # 这一新失败模式，留到 0.78 单独一轮做 ✓。
        timeout-minutes: 90
        env:
          SOKONANODA_BIN: ${{ github.workspace }}/target/release/sokonanoda
        shell: bash
        run: |
          # `--selftest` **不分片**：它是**判据通道**的自检（正控制/变异/二分/缓存一致/
          # 分片覆盖），与"判哪些目标"无关 ⇒ 每片都跑一遍（几秒，且它自己就是守卫）✓。
          python3 "$GITHUB_WORKSPACE/courses/set-theory/tools/check.py" --selftest
          python3 "$GITHUB_WORKSPACE/courses/set-theory/tools/check.py" \
            --annotations \
            --report /tmp/course-gate.json \
            --summary "$GITHUB_STEP_SUMMARY"
      - name: Save course artifacts（仅 main；门禁跑完后产物才齐）
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: courses/set-theory/.sokonanoda
          key: course-artifacts-${{ runner.os }}-${{ hashFiles('courses/set-theory/**', 'courses/set-theory/tools/check.py') }}
      - name: Upload course gate report (always)
        # 判负时也要拿到全量报告（`--json` 的落盘版）：artifact + step summary 是
        # 公开仓库上无需 token 的自助诊断通道（同 cargo-test-log 的先例）。
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: course-gate-report
          path: /tmp/course-gate.json
          include-hidden-files: false
          if-no-files-found: warn

  ledger:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.courses == 'true'
    # **矩阵并行 3 片**（2026-09-25 用户要求 ✓："能不能再多拆一些，让 github 也并行测试" ✓）：
    # `gap.py check --shard i/3` 只跑第 i 片 ✓ ⇒ 三片同时跑 ✓、某片坏只重跑那片 ✓。
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5
        with:
          # **必须全历史**（2026-10-15 · `LEDGER-SHALLOW-CHECKOUT-FALSE-RED` ✓）：本 job 的
          # `ux-queue.py --check` 有一条**祖先性断言** —— 每个 id 的**现行收口指针**必须过
          # `git merge-base --is-ancestor <sha> HEAD`（口径「非祖先必须 0 条，没有豁免」✓）。
          # 默认 `depth=1` 的浅克隆里那些历史对象**根本不在** ⇒ `is-ancestor` 返回 **128**
          # （`fatal: Not a valid commit name`，不是 1 ✗）⇒ 判据把**真祖先**读成非祖先 ✗。
          # 实测（run 38675647735 的 `ledger (1)`）：假红 **144 条**（+ 同因的指针审计
          # 97 条 = 不变量 **241 条红**），而同一份账在**全历史**下 `--check` **rc=0** ✓。
          # ⇒ 正解是**给够历史**，**不是**放宽判据 ✗（同 `e2e-ledger` 那条的先例：它要
          # rebase 的 parent 对象，也是被 depth=1 坑过 ✓）。
          fetch-depth: 0
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      # **必须有 Node**（2026-09-25 round 162 **复现确认** ✓）：若干复现件要用 `node`
      # （跑扩展侧逻辑 ✓）⇒ 没有它 ⇒ 复现件 `exit 2`（"需要 node"）⇒ 门禁判红 ✗
      # ⇒ **三片全红** ✗。定位方式 ✓：**忠实复现 CI 处境**（`env -i` + 空缓存 + 无仓库构建 ✓）
      # ⇒ 本地立刻重现同一批 `需要 node` ✓（见 `docs/CI-FAILURES.md` ✓）。
      # `gates` job 早有"Setup Node for the course gate" ✓ ⇒ 这里补同款 ✓。
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      # **必须构建本仓库的 CLI**（2026-09-25 round 179 **日志证实** ✓）：
      # `ledger` job 原来只有 `Install Rust` + `Rust cache` ✗ ⇒ `scripts/soko` 解析到
      # **已发布版**（下载 ✓）⇒ 而复现件量的是**工作树里的修复** ✗（如 `G-07`：
      # 台账写 `fixed` ✓、CI 却报"缺口仍在" ✗）⇒ **本地永远绿、CI 永远红** ✓。
      # 证据原文（`ledger (3)` 日志 ✓）：
      #   `G-07 fixed script 缺口仍在 ← 台账写的是「行为已变」，请更新 ｜复现件：→ G6 机器可读面`
      # ⇒ 与 `gates` job 的"Release CLI for the course gate"同款 ✓（那一步就是为此存在的 ✓）。
      - name: Build CLI for the gap repros
        shell: bash
        # **同时构建 LSP**（2026-09-25 round 401 ✓）：`soko lsp` 解析的是**独立的**
        # `sokonanoda-lsp`（`scripts/soko:785` ✓），而这里原先**只构建 CLI** ✗
        # ⇒ `target/release/sokonanoda-lsp` 不存在 ⇒ 落到缓存（CI 空 ✗）/下载 ⇒ **挂住** ✗
        # ⇒ 探针看门狗 120s 触发 ⇒ `exit 2` ⇒ `gap.py` 判"环境异常" ⇒ **`G-37` 判红** ✗。
        # **同时构建 debug CLI**（2026-10-11 G-112）：`G112-…sh` 测的**就是**
        # "同一版本的两个构建共用一个产物目录"，所以它需要 release + debug 两份
        # 不同 profile 的产物（`build_stamp` 里 profile 不同 ⇒ 戳不同 ✓）。
        # 只建 release ⇒ 那条复现件拿到"环境不齐"⇒ `exit 2` ⇒ `gap.py` 判红 ✗
        # （2026-10-11 CI 实测，本轮修）。debug 与 release 共用依赖缓存 ⇒ 增量很便宜。
        run: |
          cargo build --release -p sokonanoda-cli -p sokonanoda-lsp --locked
          cargo build -p sokonanoda-cli --locked
      - name: Stage bundled CLI + LSP for the extension repros
        # **G-84 的守卫以前是空转的** ✗（2026-10-03 值守实测 ✓）：`editor/vscode/bin/**`
        # 是 **gitignored**（`.gitignore:15` ✓）⇒ CI 里永远没有暂存产物 ⇒
        # `G84-vscode-cli-install.sh` 直接 `exit 2`（原文：`G-84: 扩展里没有暂存好的
        # 自带 CLI（先 npm run stage:lsp）` ✓）⇒ `gap.py` 按"环境不满足"**响亮跳过** ✗
        # ⇒ 那条守卫**咬不住任何东西** ✗（撤掉版本守卫也照样绿 ✗）。
        # 上面那一步已经把 release 的 CLI + LSP 建好了 ✓ ⇒ 这里照扩展打包的做法暂存一份
        # （`stage-lsp.js` 默认就是 host **release** 构建 ✓）⇒ 复现件能真跑出红/绿 ✓。
        # **只加这一步**：不动其它 CI 判据、不动时长 ✓。
        run: node editor/vscode/scripts/stage-lsp.js
      - name: Gap ledger is consistent (docs/gaps)
        # 台账是**契约**：每条缺口的复现必须与它的 status 对得上（fixed ⇒ 应转绿 /
        # open ⇒ 应仍复现 / 显式 repro_expect 覆盖）。只有它能让 `fixed_in` 不随语言
        # 演进悄悄腐烂——`scripts/soko gate` 的第四步是同一条。
        #
        # 二进制同样用 release（同课程门禁那一步的理由：判卷成本差一倍）。
        # **超时 3 → 5 分钟**：2026-09-21 `35518600109` 就是被这 3 分钟掐死的
        # （`selftest` 秒过，`check` 跑满 3 分钟被 kill）——这是同一条流水线上的
        # **第三个**超时阈值，改一个记得 grep 另外两个。
        #
        # 掐死它的那一条本身也修了：G-07 的复现第 ④ 段原先**整卷判一遍**（315s），
        # 而它要验的 G6 机器可读面（course.volumes/chapters）来自**清单**、与判了
        # 几个目标无关 ⇒ 改成 `--only "单元 1"`（3s）。复现总时长 9m07s → 37s。
        # **超时 5 → 10 分钟**（2026-09-25 round 370 ✓）：`0.72.0` 的发版轮里
        # 这一步报 `timed out after 5 minutes` ✗ ⇒ **三片全红** ✗ ⇒ **挡住 `auto-tag`** ✗。
        # 原因是 `G-22`/`G-25`/`G-31` 三条**环境慢 >300s** ✓（`gap.py` 自己写着
        # "环境慢，非形状不对" ✓）⇒ 它们**各自**就要几分钟 ✓ ⇒ 5 分钟装不下 ✓。
        # ⚠ **而这也验证了用户第 g3 条**：**不是**加 `continue-on-error` ✗
        # （那会掩盖回归 ✗），而是**让 `gap.py` 的三态（0/1/2）如实说话** ✓ ——
        # 它已经会写"环境慢" ✓ ⇒ **只需给够时间** ✓。
        timeout-minutes: 10
        env:
          SOKONANODA_BIN: ${{ github.workspace }}/target/release/sokonanoda
          # **每例复现的超时降到 60s**（2026-09-25 round 384 ✓）：`gap.py:42` 是
          # `REPRO_TIMEOUT_S = int(os.environ.get("SOKO_GAP_REPRO_TIMEOUT", "300"))` ✓
          # ⇒ **默认每例 300s** ✗ ⇒ `G-22`/`G-25`/`G-31` **三条环境慢例 = 900s** ✗
          # ⇒ **> 10 分钟** ✗ ⇒ **三片全超时** ✗（实测 ✓：`ledger (1)`/`(3)` 红 ✓）。
          # 降到 60s ⇒ 三条 = 180s ✓ ⇒ **装得下** ✓；而**真挂住仍会在 60s 判红** ✓
          # （**不掩盖回归** ✓ —— 这正是 `gap.py` 既有的"环境慢 ⇒ 跳过"语义 ✓）。
          SOKO_GAP_REPRO_TIMEOUT: 60
        shell: bash
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/gap.py" selftest
          python3 "$GITHUB_WORKSPACE/scripts/gap.py" check --shard ${{ matrix.shard }}/3
          # **队列/多会话守卫已搬走**（2026-10-15：洞 `LEDGER-JOB-SKIPPED-ON-DOC-ONLY-PUSH`
          # ✓ 与**同族的** `LEDGER-SHARD1-REMAINING-GUARDS` ✓）：
          # `ux-queue.py --selftest` / `--check`、`check-multi-session.py`（自检 + 真跑）、
          # `compile-cache.py --selftest` 原先**都**长在这里的 shard 1 ✗，而本 job 挂着
          # `if: rust || courses` ⇒ **纯 docs 推送时它整个被 skip** ⇒ 这些守卫在最常见的
          # 推送形态上等于没有 ✗。⇒ 现在它们在**没有 `if:` 的 `queue-lint` job** 里
          # （每推必跑 ✓，形状照 `wiring-lint` ✓；理由与实测读数见那个 job 的注释 ✓）。
          # ⚠ **别把它们再抄回这里** ✗：那只会重复跑，且**仍然**盖不住纯 docs 推送 ✓。
          #
          # ⚠ **留下的这一条不是守卫、是读数** ✓（别跟着搬 ✗）：`compile-cache.py status
          # --quiet` 量的是**本 job 自己那 146s 构建**写出来的 `target/`（`managed_entries`
          # 含主工作树的 `target/` ✓；真 CI 读数 **1.4 GB / 预算 200 GB** ✓，见 run
          # `38692915634` 的 `ledger (1)` 日志 ✓）⇒ 搬去一个**不构建**的 job 就只剩
          # runner 自带的噪声（≈0）✗ ⇒ 它**故意留在这里** ✓（预算 200 G ⇒ 只报数不判红 ✓）。
          if [ "${{ matrix.shard }}" = "1" ]; then
            SOKO_CACHE_BUDGET_GB=200 python3 "$GITHUB_WORKSPACE/scripts/compile-cache.py" status --quiet
          fi

  fast-fail:
    # **首个失败就掐掉整轮**（2026-09-25 用户要求 ✓，第 ② 条 ✓）
    #
    # 用途：`lint-fmt` 只要 8-20 秒就能红，而 `test`(19-37min) / `gates-course`(35min 上限)
    # 一旦**已经起跑**就会跑到底 ⇒ run 的"结论"被拖到最长那个 job 结束 ✗
    # ⇒ 使用者**不知道已经失败了** ✗（用户原话 ✓："ledger 立马就失败了，但整个
    # github action 还在继续，导致你不知道已经失败了" ✓）。
    #
    # ⚠ **与第 ① 条的关系（诚实说明 ✓）**：①（快速失败链 ✓）让慢 job **等**快层 ⇒
    # 快层红时它们**根本不会起跑** ✓ ⇒ 那部分②已经覆盖 ✓；② 真正补的是
    # "**慢 job 自己早早失败**"（例如 `test (sokonanoda-cli)` 第 3 分钟红 ✓，
    # 其余 job 还在跑 ✓）⇒ 这里把整轮掐掉 ✓，不再空等 ✓。
    # ⚠ 补 `queue-lint`（2026-10-15，洞 `LEDGER-JOB-SKIPPED-ON-DOC-ONLY-PUSH` ✓）：队列门禁
    # 原先由 `ledger` 顶着 ⇒ 搬去独立 job 后不补这一条，**它红了就不会掐整轮** ✗
    #（那正是本 job 存在的意义 ✓ —— 队列检查是秒级的，最适合当早期红灯 ✓）。
    needs: [changes, lint-fmt, lint-clippy, queue-lint, gates-fast, test, gates-course, ledger, contract, editor, e2e, e2e-macos, e2e-ledger]
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-24.04
    permissions:
      actions: write          # `gh run cancel` 需要它 ✓
    steps:
      # **掐之前先列清单**（2026-10-03 值守派单 ✓）：现在用户看到的是 `cancelled` + 一片
      # `skipped` ✗ ⇒ **永远不知道自己这轮少验了什么** ✗ —— 这正是"看不到绿"的根源 ✓。
      # 保留"一红就掐"本身 ✓（2026-09-25 用户明确要的 ✓），只是**把代价写清楚** ✓。
      - name: List the jobs this cancel will drop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          gh run view "${{ github.run_id }}" --repo "${{ github.repository }}" --json jobs \
            > /tmp/jobs.json || { echo "（拿不到 jobs 列表 ⇒ 跳过清单，不影响掐）"; exit 0; }
          python3 - <<'PYEOF' >> "$GITHUB_STEP_SUMMARY"
          import json
          jobs = json.load(open("/tmp/jobs.json")).get("jobs", [])
          live = [j for j in jobs if (j.get("status") or "") in ("in_progress", "queued", "pending", "requested", "waiting")]
          failed = [j for j in jobs if j.get("conclusion") == "failure"]
          done = [j for j in jobs if j.get("completedAt")]
          print(f"## 本轮被掐 · 未验证的 {len(live)} 个任务")
          print()
          print(f"- 已失败（触发掐断）：{'、'.join('`' + (j.get('name') or '?') + '`' for j in failed) or '（无）'}")
          print(f"- 已完成：{len(done)} 个 · 总数：{len(jobs)} 个")
          print(f"- **被掐掉、因此本轮没有验证**：{len(live)} 个")
          for j in live:
              print(f"  - `{j.get('name') or '?'}`（{j.get('status')}）")
          if not live:
              print("  - （没有在跑的任务 ⇒ 这轮其实跑完了 ✓）")
          PYEOF
          echo "—— 本轮被掐 · 未验证的 $(python3 -c "import json;print(len([j for j in json.load(open('/tmp/jobs.json')).get('jobs',[]) if (j.get('status') or '') in ('in_progress','queued','pending','requested','waiting')]))") 个任务（详见 Step Summary）"
      - name: Cancel this run on first failure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          echo "检测到失败 ⇒ 掐掉整轮 ${{ github.run_id }} ✓（不再空等最长的 job ✓）"
          gh run cancel "${{ github.run_id }}" --repo "${{ github.repository }}" || true
  contract:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.courses == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Version single-source (manifests)
        # 每个声明了 `requires` 的 `sokonanoda.toml` 必须等于仓库版本（T-A08）。
        # 用户原话："开发没有默认提升这个 project 的 requires，这是根因" ——
        # 陈旧的 `requires` 曾经让整个项目缓存失效（G-24），而"每个清单各写各的"
        # 就是它发生的方式。bump 走 `python3 scripts/bump.py <x.y.z>`。
        shell: bash
        run: python3 "$GITHUB_WORKSPACE/scripts/bump.py" --check
      - name: Notation rule (courses, fast)
        # 课程记法规则（2026-09-21 用户拍板）：lib + 正文 + 入门课 + playground
        # 一律 Lean 4 记法（`Eq.{1} T a b` → `a = b`、`Set.mem α a A` → `a ∈ A`、
        # `And X Y` → `X ∧ Y`、基础类型省前导隐式实参……）。纯文本扫描、秒级、
        # 不需要判卷通道；`scripts/soko gate` 里的同一条就是它。
        shell: bash
        # `--selftest` 先跑（2026-09-27 E00 补）：只用手写底座 ⇒ 不随仓库漂移 ✓。
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/notation-lint.py" --selftest
          python3 "$GITHUB_WORKSPACE/scripts/notation-lint.py"
      - name: Workflow 文件严格校验（禁重复键）
        # 2026-09-26 事故：同一 step 两个 `run:` 键 ⇒ GitHub 拒绝整个 workflow
        # （0 job、0 秒失败），而 `yaml.safe_load` 静默取最后一个 ⇒ 本地"验过了"是假的。
        shell: bash
        # `--selftest` 先跑（2026-09-27 E00 补）：含**当年事故的形态** ——
        # 同一 step 两个 `run:` 键必须被判红 ✓（否则整轮 0 job ✗）。
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/ci-yml-lint.py" --selftest
          python3 "$GITHUB_WORKSPACE/scripts/ci-yml-lint.py"
      - name: Wire 字段接缝对账（A∖B，含反向验证）
        # **CI-WIRE-GUARD（2026-10-12）**：`AGENTS.md` 验证设计纪律 §3 声称
        # `scripts/audit-wire-fields.py`「**已进 `scripts/soko gate` 与 CI**」——
        # 实测**只对了一半** ✗：它在 `scripts/soko gate` 里（soko:1198-1222，连
        # `--selftest` 一起 ✓），但 **CI 从不跑 `soko gate`**（`ci.yml` 里 4 处
        # "soko gate" **全是注释** ✗）⇒ 这条**接缝守卫在 CI 上一直空转** ✗。
        # 而它抓的正是 R-1 那类"数据对了、用户看不见"的事故（`value_runs` 全程三层绿 ✗）。
        # ⇒ 在这里补上：`--selftest` 先跑（证明它咬得住 R-1 ✓），再跑真检测 ✓。
        shell: bash
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/audit-wire-fields.py" --selftest
          python3 "$GITHUB_WORKSPACE/scripts/audit-wire-fields.py"
      - name: Machine events are well-formed JSON
        run: |
          printf 'def id : Prop -> Prop := fun (x : Prop) => x\n#check id\n' \
            | cargo run -q -p sokonanoda-cli --bin sokonanoda -- --json \
            | python3 -c 'import json,sys; [json.loads(l) for l in sys.stdin]'
  editor:
