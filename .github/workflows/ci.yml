name: ci

# **顶层并发**（2026-09-25 用户要求 ✓）：同一分支上**新的 push 取消上一轮还在跑的** ✓
# —— 之前只有 `e2e-ledger` 有 concurrency 且是 `cancel-in-progress: false` ✗，
# 于是"连推 10 个"就把 runner 配额和队列一起堵死 ✗（本 session 实测过 ✓）。
# `cancel-in-progress: true` 与"推前先关旧 run"（`scripts/ci-push.sh` ✓）**互补** ✓：
# 前者管 CI 侧 ✓、后者管本地侧 ✓ —— 两层都不依赖我记得 ✓。
#
# ⭐ **2026-10-15（洞 `PUSH-RANGE-HIDES-RELEASE`，high）：`true` 保留，但它的正确性现在
# **依赖 `changes` job 的推送范围**（见那个 job 的注释 ✓）** —— 取消**不丢验证**的理由是
# **覆盖关系** ✓：新 run 的基点 = **上一个已验证点**，而"已验证点"只在**重活真跑过且全绿**的
# 那一轮推进 ⇒ 被取消的那一轮**没有**推进它 ⇒ 新范围 ⊇ 旧范围 ✓（被取消那轮的改动都是新 sha
# 的祖先、且都在基点之后 ✓）。⇒ **不取消反而更差** ✗：新 run 自己也会跑重活（范围是脏的 ✓），
# 两条重活同时在飞 = 正是 2026-09-25 要避免的排队拥塞 ✗。
#
# ⚠ **为什么 (B)「仅当新 run 自己会跑真活时才 cancel」做不到** ✗（用户 2026-10-15 点名问过 ✓）：
# `concurrency` 是**静态**的 —— run 创建时求值，允许的上下文只有 `github`/`inputs`/`vars`
# （`needs`/`steps` 不在其中 ✗）⇒ "新 run 会不会跑真活"要先**检出仓库 + 算范围**才知道，
# 那时 run 早已创建完 ✗。三条出路都核过：
#   ① 把 `changes` 拆成独立 workflow 再 `workflow_dispatch` 主 workflow：**可以**，但
#      dispatch 的 `github.event_name`/`sha` 全变 ✗ ⇒ `auto-tag`（`if: event_name == 'push'`）、
#      `e2e-ledger`、`e2e-macos` 的判据全要重写 ⇒ **为省一次取消动整条发布链** ✗（正是本轮要修的链 ✓）；
#   ② 用 `github.event.commits` 的静态启发式：**它答不了这个问题** ✗ —— "新 run 会不会跑真活"
#      取决于**相对上一个已验证点的范围**，而不是这一推自己碰了什么（这就是本洞的定义 ✓）；
#   ③ 只做 (A)：**已足够** ✓（覆盖关系就是证据 ✓，判据 `scripts/ci-push-range.py --selftest` ✓）。
concurrency:
  group: ci-${{ github.ref }}
  # ⚠ **main 的轮次永不取消**（2026-10-18）✗ —— 起因：用户点名「连续 3 轮 cancelled，
  # 等于没真过门禁」✓，实测**连续 5 轮** `cancelled` ✗：每有新 push 就掐掉上一轮，
  # 而 main 上推得比一轮 CI 快（另一个写者）⇒ **门禁一次都没真跑完** ✗。
  # ⇒ 只在**非 main** 的 ref 上取消（PR/特性分支的快速迭代仍然省成本 ✓）。
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

on:
  push:
    branches: [main]
    # tag 只跑 release.yml（它自己带 version gate + 全平台构建）——
    # 同一 commit 再跑一轮 33-job 的 ci 是纯浪费，且 tag 一落地 `check-site data`
    # 必然红（旧口径的固定点）；2026-10-24 起 `bump.py` 同一步写 site 数据 ⇒ 这里不需要它。
    tags-ignore: ["v*"]
  pull_request:

jobs:
  lint-fmt:
    name: lint-fmt（格式，不编译）
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    # **拆出 `fmt` 单独成 job**（2026-09-25 ✓，用户："github action 是最大瓶颈" ✓）：
    # 它**不编译** ✓ ⇒ **故意不挂 Rust cache** ✗（省掉恢复缓存的时间 ✓）
    # ⇒ 约 **10–20 秒**给出格式红灯 ✓ = **最快的失败信号** ✓。
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: "rustfmt, clippy"

      - name: Format check (teaching crates)
        # crates/kernel 冻结快照使用 nightly-only rustfmt 配置，stable
        # rustfmt 无法稳定复现；fmt 门禁先覆盖教学 crates（kernel 见
        # docs/architecture.md §6）。
        run: cargo fmt -p sokonanoda-front -p sokonanoda-cli -p sokonanoda-lsp -- --check

  # **STATUS.md 的 lint**（用户 2026-09-26 ✓）：≤200 行 · 禁词 0 · 每段 ≤30（首段 ≤40）· 净增 ≤60。
  #
  # ⚠ **为什么必须是独立 job、且不设 `if:`** ✗（2026-09-26 实测 ✓）：
  # 它原本只挂在 `gates-fast` 里 ✗，而那个 job 由 `rust` 过滤器驱动 ⇒
  # **只改 `STATUS.md` 的推送根本不碰 rust 路径** ✗ ⇒ **lint 永远不跑** ✗
  # （实测：`675491b` 只改 docs ⇒ `gates-fast` **skipped** ✓）。
  # 而"只改 STATUS.md"恰恰是最常发生的情况 ✓ ⇒ **守卫等于没有** ✗。
  # ⇒ 它只要 ~1 秒 ⇒ **不设 `if:`、不加过滤器** ✓ —— 顺带避开
  # "skipped 的依赖会拖垮 `auto-tag`"那个坑 ✗（见 `changes` job 的注释 ✓）。
  status-lint:
    name: status-lint（STATUS.md 瘦身）
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: STATUS.md 瘦身 lint（总行数上限见 ratchet · 禁词 0 · 每段 ≤30 · 净增 ≤60）
        # `--selftest` **先跑**（2026-09-27 E00 补）：故意坏的形状必须被判负 ——
        # 判据通道自己坏了要在这里就红 ✗，别等真 STATUS.md 漂移了才发现 ✓。
        run: |
          python3 scripts/status-lint.py --selftest
          python3 scripts/status-lint.py

  # **文档预算**（用户 2026-09-26：「文档太重了，还没实现多少东西文档先爆炸了」✗）。
  # 与 `status-lint` 同形、同样**独立且不设 `if:`** ✗（理由同上：只改 docs 的推送
  # 是最常见的情况 ✓，挂在 rust 驱动的 job 里就永远不跑 ✗）。判据见
  # `scripts/docs-lint.py`：活文档总量 / 单文件 / 入口文件 / 设计文档冻结表 /
  # 禁垃圾 / **归档可追溯**（`docs/archive/README.md` 必须逐文件点名 ✓）。
  # ~1 秒 ⇒ 永远跑 ✓；`scripts/soko gate` 与 `scripts/ci-local.sh` 也各有一条同源判据 ✓。
  docs-lint:
    name: docs-lint（文档预算 + 归档索引）
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: 文档预算 lint（活文档/归档体积上限见 ratchet · 入口 ≤800 行 · 设计 ≤150 行/冻结 · 归档索引齐）
        run: python3 scripts/docs-lint.py

  # `scripts/tactic-docs-lint.py`（**L4**，设计 `docs/design/tactic-docs.md` §4.2）：
  # tactic 清单的**三处一致** —— 表（`crates/front/src/tactics.rs` 的 `name:`）↔
  # parser 的 tactic 臂（`parser.rs::parse_tactic_inner` 的 `kw == "…"`）↔
  # `reference/tactics/*.md` 的文件名。
  #
  # **为什么另有一条**（而不只靠 `cargo test -p sokonanoda-front`）：Rust 侧那五条判据
  # 挡不住"**绕开 `is_tactic_keyword`、直接往 `parse_tactic_inner` 加臂**"那种写法
  # —— 实测过：注入一条只有臂、没进表的关键字，**六条 Rust 判据全绿**，而这条脚本判红 ✓。
  # 一个在编译/测试侧、一个在文本侧，**两头咬** ✓。毫秒级 ⇒ 永远跑 ✓。
  tactic-docs-lint:
    name: tactic-docs-lint（tactic 清单三处一致 + selftest）
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: 清单一致（表 ↔ parser 臂 ↔ reference/tactics/*.md）
        run: python3 scripts/tactic-docs-lint.py
      - name: 判据自检（控制组判绿、三个漂移方向都必须判红）
        run: python3 scripts/tactic-docs-lint.py --selftest

  # **「声明/规范说 X，实现是 Y」的漂移守卫**（2026-10-15 LINK-B 新增两条，洞 `CHECKERS-NOT-IN-CI`；
  # ⭐ 2026-10-17 合并成**一条** `check-drift.py` = 一本登记表 + 一个驱动器 ✓，
  # `SUB-narrow-guards-to-one-layer` ① **C 组 3 → 1 做齐**：`check-doc-drift.py`（harness 接线的
  # 文档漂移：三处 README ↔ 实现）+ `check-launcher-extension-link.py`（启动器的「VS Code
  # 扩展自带」链接：C1–C4 四条「用户动作 ⇒ 可见结果」）+ `check-lsp-marker-seam.py`（marker
  # 跨接缝：一个写端 ↔ 三个读点，原 C1–C7 ⇒ 合并后 **S1–S7**）—— **同一个锚**
  # `A-HARNESS-DOCS-MATCH` · **同一个 job** · **同一批接线点** ⇒ 一层一个关注点 ✓）。
  # 两条都**只进了 `scripts/soko gate`**，而 CI 这条路上等于没有 ✗ —— 与「咬不住的守卫
  # 等于没有」同族 ✓。
  #
  # ⚠ **为什么不挂在 `gates-fast` 里**（虽然那是最省事的写法 ✗）：`gates-fast` 由
  # `changes` 的 `rust`/`courses` 过滤器驱动 ⇒ **只改文档 / 只改 STATUS.md 的推送
  # 根本不碰它** ✗ ⇒ 守卫**永远不跑** ✗。这正是本文件里 `status-lint` 已经踩过的坑
  # （见上面那条注释：实测 `675491b` 只改 docs ⇒ `gates-fast` skipped ✓），而
  # 漂移守卫里恰恰有**文档**漂移那一层 ⇒ 挂在 rust 过滤器后面是结构性错误 ✗。
  # ⇒ 照 `status-lint`/`docs-lint`/`tactic-docs-lint` 的形状：**独立 job、不设 `if:`、
  # 不加过滤器** ✓（顺带避开"skipped 的依赖会拖垮 `auto-tag`"那个坑 ✓）。
  # 步骤形状与 `gates-fast` 里的同名两步**逐字同源**（判据 + `--selftest`）✓。
  #
  # 依赖：层① 只要 python3 ✓；层② 还要 `node`、层③ 还要 `node` + `tar`（runner 自带）——
  # **探不到就 exit 3、绝不静默通过** ✓（与 gate 其它步同一条纪律 ✓）。合并后是**一次解释器
  # 启动**跑三层 ⇒ 仍是个位数秒 ⇒ 永远跑 ✓。
  #
  # ⭐ **层③ = 2026-10-15 CMT-G 那一条**（`check-lsp-marker-seam.py`，洞
  # `LSP-MARKER-NO-COMMITTED-GUARD`；⭐ 2026-10-17 **第 4 轮 `gs4` 并进本文件** ✓ ——
  # 条目 ① 的字面终点 `C 组 3 → 1` 由此到达 ✓）—— LSP 槽位的 marker 有**一个写端 +
  # 三个读点**（`editor/vscode/server.js` 写端与 `cachedServerIsCurrent` · `scripts/soko`
  # `markerExpected` · `editor/vscode/extension.js` doctor 5/6）。lspF 轮（`1b6b7eb5`）
  # 把它们一次改齐，但跨接缝探针只活在 `.cache/ux/fix-lspF/`（**不 commit** ✗）
  # ⇒ 收进 `scripts/` ✓。S1–S5 盖 LSP 槽位；**S7 是横向排查**（硬规则 0(b)）收的
  # **第二个槽位**：扩展「Install CLI」写端 `installBundledCli`（洞
  # `INSTALL-BUNDLED-CLI-MARKER-DRIFT`，markC `a5feb8b5`）的证据同样只在
  # `.cache/ux/fix-markC/`，而当时没有任何 committed 判据盖住它（`test-server.js` 只盖
  # LSP 槽位 · `test-extension-host.js` 把 `installBundledCli` 整个 stub 掉 ✗）⇒ 一并收 ✓；
  # **S6 是结构性断言**（读 `extension.js` doctor 5/6 那一段 —— 理由见脚本抬头 ✓）。
  # ⚠ **id 从 `C1–C7` 改名成 `S1–S7`**：合并后**一个登记表**里的 id 必须唯一（③ 原来的
  # `C1–C4` 与②的撞名 ✗）—— 改名**不是收窄**（域一字未动 ✓）。
  #
  # ⭐ 2026-10-15 增补**第三个**：`scripts/ci-push-range.py`（洞 `PUSH-RANGE-HIDES-RELEASE`）——
  # `changes` job 的推送范围基点从"本次推送自己"改成"上一个已验证点"（见那个 job 的注释 ✓）。
  # **为什么必须挂在这条 job 上**（而不是只留在本地）：那个洞的病根就是「**改了判据却没人验**」
  # （同族第四次 ✓），而 `changes` 自己**不在任何过滤器后面** ✓ ⇒ 把它的判据挂在这里，
  # **每推必跑**（含纯 docs 推送 ✓ —— 那正是洞发生的场景 ✓）。
  # 两条判据：`--check-wiring` 咬接线（`changes` 真的把算出来的 `base` 传给了 paths-filter ✗✓、
  # 标记的 save/restore 前缀一致 ✗✓、写标记的 job 的 `if` 带状态函数 ✓）；`--selftest` 在
  # **合成夹具仓库**上跑范围语义（含**正对照**：连续两次纯 docs ⇒ 仍不跑重活 ✓；
  # 含**负对照**：旧口径下同一推送 rust=false ⇒ 洞复现 ✓）。亚秒级 ⇒ 永远跑 ✓。
  #
  # ⚠ **`fetch-depth: 0` 是必需的，不是优化** ✗（⭐ **本轮加的** —— 2026-10-17 `gs3`）：
  # `check-drift.py` 的**咬住证明**钉在固定旧 rev（`--rev 755e5302^` ⇒ `git show <rev>:<path>`）
  # ⇒ 浅克隆里那个对象不在、判据**判不了** ⇒ 它已登记进
  # `scripts/check-ci-wiring.py` 的 `HISTORY_DEPENDENT`（**本轮实测**：登记后
  # R1 **当场判红**「`wiring-lint` 真的跑了历史判据 `scripts/check-drift.py`，而它的
  # `actions/checkout` 没有 `fetch-depth: 0`」⇒ 本行就是那条红的出路 ✓）。
  # ⚠ **如实划的边界** ✗：本 job 跑的**默认 / `--selftest`** 两层**零 git**（全文唯一的
  # `git` 在 `_git_show()` 里，只服务 `--rev`）⇒ 严格说本 job 不需要全历史；
  # 要全历史的是**它的咬住证明**（在 `queue-lint` 里由 `check-guard-bite.py --check --all`
  # 跑 ✓，那个 job 本来就有）。R1 的表是**按脚本**声明的 ⇒ 跑它的每个 job 都跟着要 ✓
  # —— 与 `check-frozen-headroom.py` / `check-queue-integrity.py` 触发器层**同形** ✓。
  wiring-lint:
    name: wiring-lint（漂移守卫「声明/规范 ↔ 实现」三层：① 三处 README ↔ 实现 · ② 扩展链接 C1–C4 · ③ marker 跨接缝 S1–S7 · 推送范围基点）
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: 漂移守卫三层（① 三处 README ↔ 实现 · ② 扩展链接 C1–C4 · ③ marker 跨接缝 S1–S7）+ 三套自检
        run: |
          python3 scripts/check-drift.py
          python3 scripts/check-drift.py --selftest
      - name: 推送范围基点（(A) 的范围语义 + 接线，改了判据必须有人验）
        run: |
          python3 scripts/ci-push-range.py --check-wiring
          python3 scripts/ci-push-range.py --selftest
      # ⭐ **「CI 的某条前提在不在」的类守卫 —— 层① `coverage`**（2026-10-15，洞
      # `PATHS-FILTER-CLASS`；⭐ 2026-10-17 第 5 轮 `gs5` 把 `check-ci-gate-coverage.py`
      # 与 `check-history-depth-wiring.py` **合成一条** `check-ci-wiring.py`，
      # `SUB-narrow-guards-to-one-layer` ③ 的第一步 ✓）——
      # `ci-push-range.py` 管**范围是从哪算的**（实例④），本层管**范围里有没有把 job
      # 要读的东西藏掉**（实例①②③）。同族**六次**里有三次是**手工往 `filters:` 里加一行**
      # 修的 ⇒ 换个触发源就再犯 ✗；这条把"job 消费的每条路径都必须被门控它的过滤器命中"
      # 变成可查的判据 ✓。**它第一次跑就自己找出两条新实例**（`examples/**` 与
      # `editor/vscode/scripts/**`，见 `filters:` 里那两条注释 ✓）。
      # `--selftest` 八条：正对照（现役 ci.yml 必须绿）+ 负对照（撤掉历史三次的修法、
      # 新加一个"消费 `editor/**` 却只被 `rust` 门控"的 job ⇒ 都必须判红 ✓）+
      # **新顶层目录**那三条（洞 `TOP-LEVEL-TABLE-GOES-BLIND`，2026-10-16：顶层条目改成
      # 按 `git ls-files` **实际枚举** ⇒ 新加一级目录**自动**进面；写死表的话那三条当场红 ✓）。
      # ⚠ **`--selftest` 是驱动器级的**（`gs3`/`gs4` 的判例 (v) ✓）：它跑**登记表对账 +
      # 绿跑对账 + 两层的正负对照** ⇒ 本 job 与 `queue-lint` **各跑一遍**（都 < 0.3s ⇒
      # 噪声级 ✓），任一处断言被删/改名都会在两处各自判红 ✓。
      - name: "CI 接线类守卫 · 层① 改动范围门控覆盖（R1 执行路径 / R2 工作流自身 / R3 数据依赖）+ 自检"
        run: |
          python3 scripts/check-ci-wiring.py --layer coverage
          python3 scripts/check-ci-wiring.py --selftest

  # ⭐ **队列门禁独立成 job、且不设 `if:`**（2026-10-15，洞
  # `LEDGER-JOB-SKIPPED-ON-DOC-ONLY-PUSH`，high ✓）—— 形状**照抄**上面的 `wiring-lint` ✓。
  #
  # **病根（实测，每一环都有读数 ✓）**：`ux-queue.py --check` 原本只长在 `ledger` 的
  # shard 1 里（那个 `if [ "${{ matrix.shard }}" = "1" ]` ✓），而 `ledger` 挂着
  # `if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.courses == 'true'` ✗
  # ⇒ **纯 docs 推送**（改了队列/台账/STATUS 这些 `docs/**` 文件、又不在 `docs/gaps/**` 下）
  # 时 `rust`/`courses` 全 false ⇒ `ledger` **整个 skipped** ✗ ⇒ **队列自己的守卫不跑** ✗。
  # 实测（85 轮普查 ✓）：`gates-fast=skipped` 的 run 有 **34 个**，其中 `ledger (1)`
  # **34/34 全部 ABSENT（skipped）**；而 `ledger (1)` 一旦真跑就长期红 ——
  # `38455544309` → `38675647735` 这段 **56 轮**里它**跑过 21 次、21 次全 failure、
  # 0 次 success**（其余 26 次 skipped、9 次随 run cancelled）✗
  # ⇒ 这正是"**咬不住的守卫等于没有**"：队列守卫在本会话最常见的推送形态上等于没有 ✗。
  #
  # ⚠ **为什么不能靠放宽 `ledger` 的 `if:`** ✗（这一半的归因**是错的** ✓，实测否掉）：
  # `rust` 过滤器**早就**含 `docs/gaps/**` + `scripts/**` + `.github/workflows/**`
  # （见 `changes` job 的 `filters:` ✓）⇒ 它读的就是那三个已是 `false` 的 output
  # ⇒ **放宽 `if:` 零效果** ✗；而且把 `test` 的 4×3 矩阵在纯文档推送上一并叫醒
  # = **33–35 分钟** ✗（正是批次制要省的成本 ✓）。
  # ⇒ 正解 = **把这条检查搬到一个没有 `if:` 的 job 里** ✓（"每推必跑"的先例就是
  # `wiring-lint`：它 2026-10-14 23:15Z 引入后 **17 轮里 0 次 skipped**（16 success +
  # 1 随 run cancelled；cancelled 那轮本 job 也可能没起跑 ⇒ 只说"没被 skip" ✗ 不说"跑完了"），
  # 含 **3 个 `gates-fast=skipped` 的纯 docs 轮** —— `38663715016` /
  # `38657859995` / `38657810157`，那三轮 `ledger` 全是 ABSENT 而它照跑 ✓）。
  #
  # ⚠ **`fetch-depth: 0` 不是可选项** ✗：`ux-queue.py --check` 有一条**祖先性断言**
  # （每个 id 的现行收口指针必须过 `git merge-base --is-ancestor <sha> HEAD` ✓）。
  # **实测**（`git clone --depth 1` 的浅克隆里跑同一条命令）：rc=**1** + "现行指针非祖先
  # **158 条**（其中查不到对象 158 条）" ⇒ **假红 270 条** ✗ —— 与
  # `LEDGER-SHALLOW-CHECKOUT-FALSE-RED` 同因（`is-ancestor` 在缺对象时返回 **128** ✗）。
  # ⇒ 照 `ledger` job 的先例给全历史 ✓。
  #
  # ⚠ **耗时**：`--check` 实测 3.9s（`scripts/ci-local.sh` 的读数 ✓）、`--selftest` 13.2s
  # ⇒ 与 `wiring-lint` 同档 ⇒ `timeout-minutes: 5` 给足余量 ✓。
  # ⚠ **判据一条都没松** ✗：两条命令逐字与原来在 `ledger` shard 1 里跑的那两条相同 ✓；
  # 门禁强度也**没松** —— 本 job 已进 `auto-tag` / `mark-verified` / `fast-fail` 的
  # `needs`（原来由 `ledger` 顶着的三道闸，现在由它顶 ✓）。
  #
  # ⭐ **同族剩余缺口一并收口**（2026-10-15，洞 `LEDGER-SHARD1-REMAINING-GUARDS` ✓）：
  # `check-multi-session.py`（自检 + 真跑）与 `compile-cache.py --selftest` 原先**也**长在
  # `ledger` shard 1 的同一个 `if [ "${{ matrix.shard }}" = "1" ]` 里 ✗ ⇒ 同一形状的洞：
  # **纯 docs 推送时它们也不跑** ✗（机械推导读数见 `ledger` 那个 step 的注释 ✓）。
  #
  # ⚠ **为什么当初没一起搬**（jbZ 的判断 ✓）："它们要 `ledger` 先建 CLI/LSP 产物
  # （`Build CLI for the gap repros` 那步）" —— ⭐ **这条前提实测不成立** ✗：
  #   · `check-multi-session.py` **只 spawn `git`**（`grep -n subprocess.run` ⇒ 两处，
  #     都是 `["git", …]` ✓；`worktree_residue` 的 `rev-list`/`status` 也走同一处 ✓）；
  #   · `compile-cache.py --selftest` 是**纯函数级**（源码自己写着"不碰真盘 ✓"，只碰
  #     `tempfile` ✓；`cmd_env` 那一段还把 `REPO`/`MAIN_WORKTREE` 换成 `/m/…` 假路径 ✓）。
  #   **实测**（`env -i` + **无** `target/release/sokonanoda` + **无** `SOKONANODA_BIN`，
  #   忠实复现 CI 处境 ✓）：这几条命令**全部 rc=0** —— 多会话自检 **0.33s** ·
  #   多会话真跑 **7.37s**（本机 85 棵工作树；CI 上 1 棵 ⇒ 亚秒 ✓）· 编译缓存自检 **0.17s**
  #   ⇒ **能自带前提 ⇒ 不需要那 146s 的构建** ✓（`ledger (1)` 实测该步 146.0s ✓）。
  # ⇒ 走**①（能自带前提的自带）**：命令**逐字同源** ✓，只多一行**自带 git 前提**
  #   （见下面那一步的注释：CI 检出里本地分支 `main` 不是总有 ✗）。
  # ⚠ **实测耗时**（真 CI run `38692915634` 的 `ledger (1)` 日志 ✓）：多会话两条 + 编译缓存
  #   自检 + 缓存读数在 runner 上合计 **0.158s**（06:35:25.8108 → 06:35:25.9686 ✓）
  #   ⇒ 加进本 job（真 CI 17s ✓）是**噪声级** ✓；本机同口径 0.33 + 7.37 + 0.17 = 7.87s，
  #   差的是"85 棵工作树 vs 1 棵"（真跑那条会遍历 `git worktree list` ✓）。
  board:
    name: board（队列 + 多会话 + 计划一致性；不设 if ⇒ 每推必跑）
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # 2026-10-24 由 queue-lint 拆出（用户：要在 Actions 上直接看到哪条门禁红）。
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: 队列门禁（覆盖自检 + 调度器不变量）+ 自检
        # 与原先长在 `ledger` shard 1 里的那两条**逐字同源** ✓（搬过来，不是另写一份 ✗）。
        run: |
          python3 scripts/ux-queue.py --selftest
          python3 scripts/ux-queue.py --check
      - name: 多会话台账守卫（共享台账只在 main 上改）+ 自检
        # 与原先长在 `ledger` shard 1 里的那两条**逐字同源** ✓（搬过来，不是另写一份 ✗）。
        #
        # ⚠ **先自带 git 前提**（2026-10-15 · 本洞的修法① ✓，形状照 `stY` 给夹具自带
        # git 前提的做法 ✓）：`check-multi-session.py` 的默认基线是**本地分支** `main`，
        # 而 `actions/checkout` **只在"推的就是 main"时才建它** ✗ ——
        # `getCheckoutInfo`（v5 的 `ref-helper.ts` ✓）：`REFS/HEADS/*` ⇒ `result.ref = <分支>`
        # + `startPoint` ⇒ `git checkout -B <分支>` ✓；`REFS/PULL/*` ⇒ `result.ref =
        # refs/remotes/pull/<n>/merge`、**没有 startPoint** ⇒ 裸检出 ⇒ **detached** ✗。
        # ⇒ 分支推送 / PR 上 `--base main` 会 **rc=2「找不到基线分支 main」** ✗ ——
        # 那是**环境错**（用法错），不是判红 ✗（实测：合成 PR 形状的仓库 —— detached HEAD +
        # 只有 `refs/remotes/origin/main` —— 里同一条命令 **rc=2** ✓，补上 `main` 后 **rc=0** ✓）。
        # `fetch-depth: 0` ⇒ `getRefSpecForAllHistory` = `+refs/heads/*:refs/remotes/origin/*`
        # ⇒ **`origin/main` 一定在** ✓ ⇒ 本地没有 `main` 就拿它补一个 ✓；
        # **推的就是 main 时这一行什么都不做** ✓（保持与 shard 1 逐字同源的跑法 ✓，
        # 真 CI 读数："multi-session: ✓ 主工作树 · 分支 `main`" ✓）。
        # ⚠ **不改成 `--base origin/main`** ✗：那会让脚本里"`cur == base` ⇒ 在 main 上不判落后"
        # 的短路失效（`main` ≠ `origin/main` ✓）⇒ 与 `e2e-ledger` **每轮往 main 回提交**
        # 撞车时**假红** ✗（真 CI 里那条回提交 job 就在 `needs` 里 ✓）。
        run: |
          git rev-parse --verify -q main >/dev/null || git branch main refs/remotes/origin/main
          python3 scripts/check-multi-session.py --selftest
          python3 scripts/check-multi-session.py
      - name: 队列独立复核 + 收口指针触发器（合并后一份：登记表 + 驱动器）
        # 2026-10-15 · `SUB-orchestrator-attention-structure`【1】/【2】 ✓。
        # 病根 = **判据的所有权**：`ux-queue.py` 同时定义队列语义/守卫/证据规则/**复核判据**
        # ⇒ 工具错 = 账错 = 过程错，**没有外部检查**能发现它 ✗（它本会话被改 54 次、
        # 自报 16 轮"独立"复核，而复核者与实现者是同一个进程 ✗）。
        # `check-queue-integrity.py` 的**复核层**（R-C1…R-C6）**不 import** 它
        # （`C6` 自证 + `--selftest` 钉着 ✓），
        # 只读**原始读数**（事件流 + 纯 git `merge-base --is-ancestor`）⇒ 它的自报结论
        # 是**被告**，不是判据 ✓。判据：C1 原始层卫生 · C2 两份实现折出**同一状态**
        # （差分测试）· C3 两层不漂移（两个方向都判）· C4 指针祖先性（折过 `repoint` 的
        # **最终**指针 ✓ —— 拿原始 sha 判会造 100+ 条假红 ✗）· C5 收口证据可独立复算
        # （**ratchet**：不可复算的条数 ≤ 冻结上限，只许减不许增 ✓）。
        # ⭐ **2026-10-17（`SUB-narrow-guards-to-one-layer` 第 2 轮）合并**：同一个关注点的两条
        # B 类守卫（`check-queue-views.py` + `check-queue-rewrite-trigger.py`）合成本文件 ⇒
        # **B 类 21 → 20**（C8 的上限**一个字没动** ✗）；`--selftest` 现在**两套一起跑**
        # （复核层 + 触发器层 + 登记表对账 ✓）⇒ 本步的覆盖面**只增不减** ✓。
        # 实测 1.5s（合并后 `--selftest` 两套合计 ~2.6s）· 本 job 本来就 `fetch-depth: 0`
        # （C4 与触发器那条咬住证明都要全历史 ✓）。
        run: |
          python3 scripts/check-queue-integrity.py --selftest
          python3 scripts/check-queue-integrity.py
      - name: "计划一致性（CI 面：不跑 hook 的推送也要有人知道）"
        # 2026-10-17 · `ng4`（`check-guard-bite.py` 的 **C12 双面**把这一格判红后补的 ✓）：
        # `scripts/plan.py check` 此前**只有本地面**（`ci-local.sh:263` 的 `run` 步 ✓）✗
        # ⇒ 在**不跑 hook 的推送**（`--no-verify` / 机器人 / 没装 `core.hooksPath` 的检出）上，
        # `docs/design/e2-plan.md` §13 的清单与正文漂移（`round 145` 那次：`- [~]` 不被认 ⇒
        # 进度 50 → 49 ✗）**没人知道** ✗ —— 而它是**收尾完整性检查**，后果落在别处
        # （下一次提交被另一条判据挡住 ✓）。
        # ⚠ **为什么在本 job**：`queue-lint` **不设 `if` 过滤器 ⇒ 每推必跑** ✓（纯 docs 推送
        # 也跑 —— 而漂移正是 docs 改动造出来的 ✓）。
        # ⚠ **前提**（**实测** ✓）：纯文本（只读 `docs/design/e2-plan.md`）、**不需要** git /
        # 网络 / 二进制 / 全历史 ⇒ 本 job 的全历史是**顺带** ✓、**不进** `HISTORY_DEPENDENT` ✗；
        # 实测 **0.07s** ⇒ 进本 job（5 分钟预算）是噪声级 ✓。
        run: |
          python3 scripts/plan.py check

  guard-bite:
    name: guard-bite（每条守卫都必须咬住一条已存在的坏输入）
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # 2026-10-24 由 queue-lint 拆出；台账的 `ci_job: guard-bite` 在这里跑。
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: "咬住证明（新守卫必须自带「已存在的坏输入 ⇒ 报非 0」）"
        # 2026-10-16 · 用户 2026-10-15【④】：「停止'守卫的守卫' ⇒ 出路是端到端判据」——
        # **任何新守卫必须自带"咬住证明"**（一条**已存在的坏输入**被它咬住 + 跑给人看）✓。
        # 仓库**已有**那条规则（`AGENTS.md:289`「**咬不住的守卫等于没有**」）——
        # 用户说得很准：**"只是没强制"** ✗。本步把它变成判据 ✓：
        # `docs/guard-bite.jsonl` 每行的 `pass` 要绿、**`bite` 要真的报非 0** ✓；
        # 覆盖基线以来**新增/修改的每个守卫**都必须有一行 ✓（缺 ⇒ 判红 ⇒ **不算收口** ✗）。
        # ⚠ **`--reopen-empty` 是【①】的翻账入口**（守卫空了 ⇒ **reopen 它关掉的那条** ✓）：
        # 本步**不**自动写台账（CI 里不写 ✗）—— 它由外部验收方在主 checkout 上跑 ✓。
        #
        # ⚠⚠ **`--job guard-bite` 是必须的**（2026-10-16 CI 实测红 ✗→✓）：
        # 本 job 只有 5 分钟、**不装 `editor/vscode/node_modules`、也没有真 VS Code**，
        # 而台账里有 4 条证明要的正是那些（`scripts/third-layer-bite.sh` 环境缺失 ⇒ **exit 3**，
        # 而 `pass` 期望 0 ⇒ 判红）⇒ "一条命令扫全部"在 CI 上**必然假红**（红的是"环境不在"、
        # **不是**"守卫咬不住" ✗ —— 读数不可归属 ✗）。⇒ 台账用 `ci_job` **分派**，
        # 本步跑**本 job 的那批** ✓；`ci_job: editor` 那批由 `editor` job 跑（它**已经**
        # 建 debug LSP/CLI + `npm ci` ✓ ⇒ 只需补 VS Code 缓存与那一跑 ✓）。
        # ⚠ **这不是放宽** ✗：判据 **C4** 会核"每个 `ci_job` 都真的存在且真的有一跑它"——
        # 把证明标到一个不存在的 job ⇒ **判红**（藏起来 = 空转 ✗）。
        run: |
          python3 scripts/check-guard-bite.py --selftest --job guard-bite
          python3 scripts/check-guard-bite.py --check --all --job guard-bite

  budgets:
    name: budgets（簿记预算 + 横向阈值 ratchet + 冻结余量）
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: "簿记预算 ratchet（每轮收紧一档 · 本轮没比上轮低 ⇒ 判红）"
        # ⚠ 名字**必须加引号** ✗→✓：裸标量里的 ` : ` 会被 YAML 当成**又一层映射** ⇒
        # `ci-yml-lint` 当场判红（实测 `.github/workflows/ci.yml:292:27 mapping values are
        # not allowed here` ✓）—— 这正是那个"严格 loader"存在的理由 ✓。
        # 2026-10-15 · 同上的【5】/【5'】 ✓。用户实测本会话（2026-10-14 起 246 笔）：
        # **生成物/台账 76,280 行 : 产品 4,572 行 ≈ 17 : 1** · **队列/CI/基建类提交 137/246
        # = 56%** · 改动最频繁的前 4 个文件**全是队列簿记**（合计 259 次触达）✗。
        # ⇒ 病根是**注意力结构**（时间花在维护"关于工作的账"上，而账本身又不断出问题）✗。
        # ⭐ **2026-10-16 改成真 ratchet**（用户 2026-10-15【②】）—— 改前那两档
        # （`RATIO_MAX = 19.0` / `SHARE_MAX = 0.60`）**贴在实测上方**（实测 10.14 : 1 / 56.6%）
        # ⇒ **永远绿 ⇒ 装饰** ✗；而本文件自己的注释还写着第一版贴实测取 17.0 ⇒ 落地当刻
        # 判红 ⇒ **抬到 19.0** ✗（用户 2026-09-26：「**不许靠抬上限达标 —— 上限方向只能是收紧**」）。
        # ⇒ 现在：**本轮生效的两档在 `docs/attention-budget-ratchet.json`**（tracked ⇒ 逐轮
        # 读数进 git ✓），由 `--open-round` **每轮降一档**（`SHARE_MAX` 每轮 −2 个百分点 ✓），
        # 红线定义 = 「**本轮没比上轮低 ⇒ 判红**」✗→✓；**种子仍是 19.0 / 0.60**（= 上界：
        # `tighten()` 单调不增 ⇒ **一个阈值都没放松** ✓）。告警线跟着红线一起收紧 ✓。
        # ⚠ **谁开轮不是纪律** ✓：`state.head` 之后落超过 `ROUND_MAX_COMMITS = 80` 笔还没开轮
        # ⇒ **默认跑就判红**（ratchet 空转 ✗）；想消红只能 `--open-round`，而它要求
        # **读数真的降了** ⇒ **红有出路**（多落产品）✓，不是假红生成器 ✓。
        # ⚠ **为什么不是"红线 = 今天的实测值"**（第一版就是这么写的，**实测在落地当刻判红** ✗）：
        # `main` 在切出 commit 之后又落了 2 笔 ⇒ 17.13 > 17.0 ⇒ 红，而**那条红没有出路** ——
        # 本窗生成物的 **97.9% 是 `docs/e2e/logs/**`**，而 e2e 台账是 `AGENTS.md` **明文要求
        # 每批记一条**的动作 ⇒ 拿今天的实测值当红线 = **惩罚被规定的行为** ✗ ⇒ 假红生成器。
        # ⭐ ratchet 给的是**另一条出路**：红 = "这一轮没变好"，而**多落产品就能变好** ✓
        # （实测：本窗 302 笔里加 1 笔非簿记提交 ⇒ 56.6% → 56.4% ✓）。
        # ⚠ **窗口是固定锚点 → HEAD，不是滑窗** ✗：滑窗会在"一笔大产品提交老化出窗"时
        # 把比值推高 ⇒ **假红** ✗（实测近 50 笔读数是 72.97 : 1 —— 那是**只报不判**的
        # 近窗读数 ✓，见 `--recent`）。锚点往前推 = 批次边界上的手改（评审可见 ✓）。
        # ⚠ 浅克隆 ⇒ **rc=3 + 人话**（绝不静默判过 ✗）；本 job 有 `fetch-depth: 0` ✓。
        # ⭐ **接缝**（2026-10-16，洞 `BUDGET-WARN-VS-GATE-RED-INCONSISTENT`）：caps 只许有
        # **一份**（`docs/attention-budget-ratchet.json`）—— `ci-local.sh` 的 step 标签
        # 必须用 `--label` 从状态读（改前写死种子常量 ⇒ 印的是上一轮的 caps ✗）。
        run: |
          python3 scripts/check-budgets.py --layer attention --seam
          python3 scripts/check-budgets.py --layer attention --selftest
          python3 scripts/check-budgets.py --layer attention
      - name: "横向阈值 ratchet（7 个装饰性上限：状态不变量 + 接缝 + 开轮纪律）"
        # 2026-10-16 · 用户 2026-10-15【②】的**横向**落地（`SUB-correct-the-orchestrator-incentives`）：
        # 上面那步是**簿记**的两档；本步是**横向**那批**装饰性阈值**（上限贴在实测上方 ⇒ 永远绿 ✗）——
        # 逐处 `文件:行` + 落地实测见 `scripts/threshold_ratchet.py` 的登记表（唯一一处 ✓）。
        # 判三件：① **caps 单调不增 + 永不高于种子**（= "一个阈值都没放松"的机械面 ✓）；
        # ② **接缝**（7 个消费点真的读 ratchet ⇒ 谁把上限改回常量，谁当场被咬住 ✗；
        #    ⭐ 2026-10-16 补**标签接缝**：**step 名里不许写 ratchet 的值** —— 本文件的两个
        #    标签改前写着种子 `活文档 ≤10.0 MB`（现行 caps 已是 `9.50 MB` ✗，洞
        #    `BUDGET-WARN-VS-GATE-RED-INCONSISTENT` 的同族）⇒ 现在只写"上限见 ratchet" ✓）；
