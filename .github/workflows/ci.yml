name: ci

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: "rustfmt, clippy"

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Format check (teaching crates)
        # crates/kernel 冻结快照使用 nightly-only rustfmt 配置，stable
        # rustfmt 无法稳定复现；fmt 门禁先覆盖教学 crates（kernel 见
        # docs/architecture.md §6）。
        run: cargo fmt -p sokonanoda-front -p sokonanoda-cli -p sokonanoda-lsp -- --check

      - name: Clippy
        # 严格度由教学 crates 各自的 [lints.rust] warnings = "deny" 注入；
        # kernel 的上游遗留 lint 保持 warning 级（冻结快照原则）。
        run: cargo clippy --workspace --all-targets

  # 自动打 tag + 触发发布：main 上 lint/test 全绿后，若 Cargo.toml 的版本
  # 还没有对应的 v* tag，就打 tag 并 workflow_dispatch release.yml。
  #
  # 为什么两步而不是只推 tag：用 GITHUB_TOKEN 推的 tag **不会**触发其它
  # workflow（GitHub 的防递归规则），所以推完 tag 还要显式 dispatch——
  # workflow_dispatch 恰是这条规则的例外，GITHUB_TOKEN 触发它有效。
  # 幂等：tag 已存在就跳过（版本号没变时每个 push 都不会重复发布）。
  auto-tag:
    needs: [lint, test, gates, ledger, contract, editor, e2e, e2e-macos]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # workflow_dispatch 需要它（403 "Resource not accessible by
      # integration" 的教训：只给 contents: write 时 gh workflow run 被拒）。
      actions: write
    steps:
      - uses: actions/checkout@v5
      - name: Tag v$VERSION when it does not exist yet, then dispatch release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cargo_version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          ext_version=$(python3 -c "import json;print(json.load(open('editor/vscode/package.json'))['version'])")
          if [ "$cargo_version" != "$ext_version" ]; then
            echo "::error::Cargo.toml ($cargo_version) and editor/vscode/package.json ($ext_version) disagree; the version contract (docs/RELEASE.md §2) requires both before tagging."
            exit 1
          fi
          tag="v${cargo_version}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "::notice::tag ${tag} already exists — nothing to release."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$tag"
          git push origin "refs/tags/${tag}"
          gh workflow run release.yml --ref "$tag"
          echo "::notice::tagged ${tag} and dispatched release.yml"

  changes:
    # **只跑相关的**（2026-09-25 用户要求 ✓："现在 github action 过于阻碍开发进度了" ✓）：
    # 纯文档 / 纯课程改动**不该**跑 4 路 crate 矩阵与 e2e ✗（它们是大头 ✓）。
    # 用生态里最常见的 paths-filter ✓（按大版本钉 ✓，与仓库其它 action 同风格 ✓）。
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.f.outputs.rust }}
      editor: ${{ steps.f.outputs.editor }}
      courses: ${{ steps.f.outputs.courses }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            rust:
              - "crates/**"
              - "Cargo.toml"
              - "Cargo.lock"
            editor:
              - "editor/**"
            courses:
              - "courses/**"
              - "playground.sokonanoda"

  test:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # **按 crate 的 4 路矩阵**（2026-09-25 用户要求 ✓："能尽可能细吗？现在 github action
    # 过于阻碍开发进度了" ✓）：一条 `cargo test --workspace` 在 CI 上 ~19 分钟 ✗ ⇒ 拆四路并排 ✓
    # ⇒ 单条 ~5 分钟 ✓、**失败直接指名哪个 crate** ✓（改 front 不必等 cli 的测试 ✓）。
    strategy:
      fail-fast: false
      matrix:
        pkg: [sokonanoda, sokonanoda-front, sokonanoda-cli, sokonanoda-lsp]
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Workspace tests
        # tee 保留完整输出；--no-fail-fast 让所有失败一次暴露。
        # 失败时把完整日志作为 artifact 上传（公开仓库也能从 run 页下载），
        # 避免「CI 红了但拿不到日志」的排查死角（2026-09-13 实况）。
        shell: bash
        # 步骤级也有上限 ✓ ⇒ 卡住时能**指名是哪一步** ✓（job 级上限只给"失败"✗）。
        timeout-minutes: 35
        run: |
          set -o pipefail
          cargo test -p ${{ matrix.pkg }} --locked --no-fail-fast 2>&1 | tee /tmp/cargo-test.log
      - name: Per-suite timing (always)
        # **分套回显**（2026-09-25 补 ✓）：一条 `cargo test --workspace` 是一大块 ✗，
        # 慢在哪一套看不出来 ✓ ⇒ 把每套的 `test result:` 行列出来 ✓（含耗时 ✓）。
        if: always()
        shell: bash
        run: |
          echo "=== 每套测试的结果与耗时 ==="
          grep -E "^(test result:|running [0-9]+ tests?|     Running)" /tmp/cargo-test.log || echo "(没有日志 ✗ —— 说明卡在上一步之前)"
          echo "=== 最慢的 10 套（按耗时排序）==="
          grep -E "^test result:" /tmp/cargo-test.log | sed -E 's/.*finished in ([0-9.]+)s.*/\1 &/' | sort -rn | head -10 || true
      # 注解走 check-runs API，**无需鉴权即可公开读取**（logs/artifact 都要
      # token）——这是无 gh/token 环境下唯一的自服务诊断通道。
      - name: Surface failing tests as annotations
        if: failure()
        shell: bash
        run: |
          grep -E "^test .* FAILED$" /tmp/cargo-test.log | while read -r line; do
            echo "::error::$line"
          done
          grep -E "^error(\[E[0-9]+\])?:" /tmp/cargo-test.log | head -20 | while read -r line; do
            echo "::error::$line"
          done
      - name: Upload test log (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cargo-test-log
          path: /tmp/cargo-test.log
          include-hidden-files: false
      - name: Protocol conformance (--json events)
        run: cargo test -p sokonanoda-cli --test protocol --locked

      # 性能例行化（I13-S5c）：每次 push 产出性能报告 artifact——阈值断言
      # 已在上面 Workspace tests 里把红（回归即失败），这一步额外留档：
      # 报告带版本 + commit SHA，按版本可追溯「哪个改动引入了性能回退」。
      - name: Performance report
        # **调用同一个脚本**，不在这里复制粘贴命令：口径（`--test-threads=1`、
        # best-of-N、跑哪些套件）只能有一份真相。以前这里漏了 `--test-threads=1`，
        # 与本地/台账的串行口径不一致；而且新增套件（如 `perf_course`）得手改两处。
        run: |
          set -o pipefail
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          out="perf-report-v${version}-$(git rev-parse --short HEAD).txt"
          scripts/perf-report.sh "$out"
      - name: Upload perf report
        uses: actions/upload-artifact@v7
        with:
          name: perf-report
          path: perf-report-*.txt
          include-hidden-files: false

  gates:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.courses == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Lesson corpus is valid
        run: |
          for f in examples/*.sokonanoda; do
            echo "checking $f"
            cargo run -q -p sokonanoda-cli --bin sokonanoda -- "$f" >/dev/null
          done
      - name: Course layer is guarded (canvases, solutions, course.json)
        run: cargo test -p sokonanoda-cli --test course --locked
      - name: Setup Node for the course gate
        # 课程门禁的判据在 courses/set-theory/tools/check.py（python3）；判卷通道是
        # `grade`（node 启动器解析二进制，或直接用下面给的当轮二进制）。
        # 显式钉 node 22（与 editor 集成测试同口径），不用 runner 的默认版本。
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # 课程门禁（卷 I《集合论》）：判据 G1–G5，**与规模无关**（不锁计数——课程还在长）。
      # 唯一真相是课程自己的 check.py（硬规则 6：课程线零 cargo），它内部只认
      # `grade` 的退出码（G-10）、一律绝对路径（G-12）、失败时给不依赖 span 的
      # `--bisect`（G-15）。--selftest 先跑：故意坏的单元必须被判负，判据通道失效时
      # 这一步自己红。
      #
      # 二进制用**当轮 cargo 刚编出来的 release**：版本天然一致、零下载
      # （`scripts/soko setup` 在版本 bump 的 main push 上必然 404），而且它才是
      # **发布形态**——debug 二进制判同一份课程要慢一倍（实测 190s vs 93s，
      # 卷 I 单元⑫ 的解答），2026-09-21 `35516857130` 就是被这个差额顶穿
      # 单目标 180s 上限的。profile 显示两边做的是同样的工作，纯粹是优化等级，
      # 所以"用 release 判"既更快也更忠实；根因（`by` 块每走一步 tactic 都要
      # 重新判定整份文档 ⇒ 代价随文件超线性）记在 STATUS.md 的未做项与
      # `docs/design/site-single-page.md` §2 的"未来的计划"里，**尚未进缺口台账**
      # （要进就得配一条 CI 预算内的确定性复现，别为了凑格式塞一条跑不动的）。
      # 为什么是 test job 里的一个 step 而不是独立 job：见
      # docs/design/course-gate-in-ci.md §2（独立 job 要么自己再编一份 Rust、要么
      # 下载还不存在的 release，且很容易漏进 auto-tag 的 needs ⇒ 假绿发布）。
      #
      # **超时按实测标定**（2026-09-21：`35512977249` 被 5 分钟掐死；改成 20 分钟后
      # `35516857130` 暴露出真正的瓶颈是单目标 180s 上限而不是总时长）。release
      # 二进制下整卷门禁本机约 2.5 分钟、runner ≈ ×2 ⇒ 5 分钟量级，20 分钟留 4× 余量。
      # 课程会长大、判卷成本随之上升，这个数要跟着实测走。
      - name: Release CLI for the course gate
        # release profile 的依赖在上面的 perf report 步（`--release ... perf_project`）
        # 已经编好，这一步只补 `--bin sokonanoda` 这一个目标。
        run: cargo build --release -p sokonanoda-cli --locked
      - name: Course gate (set-theory, G1–G5)
        timeout-minutes: 20
        env:
          SOKONANODA_BIN: ${{ github.workspace }}/target/release/sokonanoda
        shell: bash
        run: |
          python3 "$GITHUB_WORKSPACE/courses/set-theory/tools/check.py" --selftest
          python3 "$GITHUB_WORKSPACE/courses/set-theory/tools/check.py" \
            --annotations \
            --report /tmp/course-gate.json \
            --summary "$GITHUB_STEP_SUMMARY"
      - name: Upload course gate report (always)
        # 判负时也要拿到全量报告（`--json` 的落盘版）：artifact + step summary 是
        # 公开仓库上无需 token 的自助诊断通道（同 cargo-test-log 的先例）。
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: course-gate-report
          path: /tmp/course-gate.json
          include-hidden-files: false
          if-no-files-found: warn

  ledger:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.courses == 'true'
    # **矩阵并行 3 片**（2026-09-25 用户要求 ✓："能不能再多拆一些，让 github 也并行测试" ✓）：
    # `gap.py check --shard i/3` 只跑第 i 片 ✓ ⇒ 三片同时跑 ✓、某片坏只重跑那片 ✓。
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Gap ledger is consistent (docs/gaps)
        # 台账是**契约**：每条缺口的复现必须与它的 status 对得上（fixed ⇒ 应转绿 /
        # open ⇒ 应仍复现 / 显式 repro_expect 覆盖）。只有它能让 `fixed_in` 不随语言
        # 演进悄悄腐烂——`scripts/soko gate` 的第四步是同一条。
        #
        # 二进制同样用 release（同课程门禁那一步的理由：判卷成本差一倍）。
        # **超时 3 → 5 分钟**：2026-09-21 `35518600109` 就是被这 3 分钟掐死的
        # （`selftest` 秒过，`check` 跑满 3 分钟被 kill）——这是同一条流水线上的
        # **第三个**超时阈值，改一个记得 grep 另外两个。
        #
        # 掐死它的那一条本身也修了：G-07 的复现第 ④ 段原先**整卷判一遍**（315s），
        # 而它要验的 G6 机器可读面（course.volumes/chapters）来自**清单**、与判了
        # 几个目标无关 ⇒ 改成 `--only "单元 1"`（3s）。复现总时长 9m07s → 37s。
        timeout-minutes: 5
        env:
          SOKONANODA_BIN: ${{ github.workspace }}/target/release/sokonanoda
        shell: bash
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/gap.py" selftest
          python3 "$GITHUB_WORKSPACE/scripts/gap.py" check --shard ${{ matrix.shard }}/3

  contract:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.courses == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Version single-source (manifests)
        # 每个声明了 `requires` 的 `sokonanoda.toml` 必须等于仓库版本（T-A08）。
        # 用户原话："开发没有默认提升这个 project 的 requires，这是根因" ——
        # 陈旧的 `requires` 曾经让整个项目缓存失效（G-24），而"每个清单各写各的"
        # 就是它发生的方式。bump 走 `python3 scripts/bump.py <x.y.z>`。
        shell: bash
        run: python3 "$GITHUB_WORKSPACE/scripts/bump.py" --check
      - name: Notation rule (courses, fast)
        # 课程记法规则（2026-09-21 用户拍板）：lib + 正文 + 入门课 + playground
        # 一律 Lean 4 记法（`Eq.{1} T a b` → `a = b`、`Set.mem α a A` → `a ∈ A`、
        # `And X Y` → `X ∧ Y`、基础类型省前导隐式实参……）。纯文本扫描、秒级、
        # 不需要判卷通道；`scripts/soko gate` 里的同一条就是它。
        shell: bash
        run: python3 "$GITHUB_WORKSPACE/scripts/notation-lint.py"
      - name: Machine events are well-formed JSON
        run: |
          printf 'def id : Prop -> Prop := fun (x : Prop) => x\n#check id\n' \
            | cargo run -q -p sokonanoda-cli --bin sokonanoda -- --json \
            | python3 -c 'import json,sys; [json.loads(l) for l in sys.stdin]'
  editor:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.editor == 'true'
    runs-on: ubuntu-latest
    # **从原 `test` 拆出**（2026-09-25 用户要求 ✓）：6 步 ✓
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Build server + CLI for editor integration tests
        # editor/vscode 的集成测试不自己构建：它只发现 target/ 下的二进制
        # （extension.js 的自动发现逻辑），所以必须先构建两者。
        run: cargo build -p sokonanoda-lsp -p sokonanoda-cli --locked
      - name: Stage bundled binaries (VSIX layout)
        # 按打包布局 stage 到 bin/<target>/：bundled 解析优先于 target/ 发现，
        # 因此集成测试验证的就是用户安装平台包后的那条路径（LSP + CLI）。
        run: node editor/vscode/scripts/stage-lsp.js --profile debug
      - name: Setup Node for editor integration tests
        uses: actions/setup-node@v5
        with:
          # @vscode/test-electron 3.x 要求 node >= 22。
          node-version: 22
          cache: npm
          cache-dependency-path: editor/vscode/package-lock.json
      - name: Install editor test dependencies
        working-directory: editor/vscode
        run: npm ci --no-fund --no-audit
      - name: Download + resolution logic unit tests
        # 纯 Node.js 单元测试：server.js 的 bundled 解析/版本锁定 URL/平台映射，
        # 以及 followRedirects 与 tar 解压逻辑；不依赖 Rust / VS Code，秒级完成。
        working-directory: editor/vscode
        run: npm run test:unit
      - name: Package host VSIX (bundled payload smoke)
        # 每次 CI 都走一遍真实打包：断言 bin/<target>/ 在包里且可执行位正确
        # （exec 位只能在 Linux/macOS 打包时保留）。发布 dry-run 之外的第一道闸。
        working-directory: editor/vscode
        run: |
          npx --yes @vscode/vsce package --target linux-x64 --out /tmp/host.vsix
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile("/tmp/host.vsix") as zf:
              manifest = zf.read("extension.vsixmanifest").decode()
              assert 'TargetPlatform="linux-x64"' in manifest
              for base in ["sokonanoda-lsp", "sokonanoda"]:
                  name = f"extension/bin/linux-x64/{base}"
                  info = zf.getinfo(name)
                  mode = (info.external_attr >> 16) & 0o777
                  assert info.file_size > 1_000_000, (name, info.file_size)
                  assert mode & 0o111, (name, oct(mode))
                  print(f"host VSIX ok: {name} mode={oct(mode)} size={info.file_size}")
          PY

      # 真 VS Code 集成测试已移到独立的 `e2e` job（多 OS/多版本矩阵 + 留档），
      # 见文件末尾：它跑的是 `scripts/vscode-e2e.sh`（构建 release + stage +
      # 真宿主 + 记账），并用 `needs` 卡住 auto-tag。
  # 真 VS Code 集成测试（e2e · Linux 腿）：与本地例行同一条命令
  # （`scripts/vscode-e2e.sh` = 构建 release → stage → 真宿主 → 记
  # `docs/e2e/`），覆盖**当前稳定版**与**声明的最低 VS Code 版本**。
  # 结果进 job summary 与 artifact（回提交仓库的是收尾的 `e2e-ledger` job）。
  #
  # 为什么 macOS 是**另一个 job** 而不是同一矩阵里的一条腿：**job 级 `if` 不能
  # 引用 `matrix` 上下文**（GitHub 的 contexts 可用性表里 `jobs.<job_id>.if` 只有
  # `github`/`needs`/`vars`/`inputs`）——在 job 级写 `if: matrix.os != '…'` 属于
  # 未识别命名值，workflow 直接校验失败（整个 CI 一条都不会跑）。所以"只在 main
  # 上跑 macOS"只能靠第二个 job 的 github-only 条件；两条腿的步骤因此各写一份
  # （比再引一层 `workflow_call` 少一个文件、也少一处需要同步的版本号）。
  e2e:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.editor == 'true'
    name: e2e (${{ matrix.os }} · VS Code ${{ matrix.vscode }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            vscode: "1.138.0"
          # 声明的最低版本（engines.vscode ^1.106.0）：2026-09-18 本地 14/14 验过
          # （docs/e2e 有那条台账），守"用的 API 没超出声明范围"。
          - os: ubuntu-latest
            vscode: "1.106.0"
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Setup Node for editor integration tests
        uses: actions/setup-node@v5
        with:
          # @vscode/test-electron 3.x 要求 node >= 22。
          node-version: 22
          cache: npm
          cache-dependency-path: editor/vscode/package-lock.json

      - name: Cache the VS Code download
        # 每个版本 ~300MB/平台；钉住版本后这份缓存长期有效（key 含 OS 与版本）。
        # 只缓存 VS Code 本体（`vscode-*`），不缓存 user-data（测试状态每次干净）。
        uses: actions/cache@v4
        with:
          path: editor/vscode/.vscode-test/vscode-*
          key: vscode-${{ runner.os }}-${{ matrix.vscode }}

      - name: Install editor test dependencies
        working-directory: editor/vscode
        run: npm ci --no-fund --no-audit

      - name: Real VS Code integration tests (recorded)
        # 与本地同一条命令：构建 release（被测即发布形态）→ stage 到
        # bin/<target>/ → vscode-test → docs/e2e/{ledger.jsonl,latest.json,logs}。
        # Linux 上 Electron 需要显示器，xvfb 在 ubuntu-latest 镜像里预装。
        env:
          SOKO_VSCODE_TEST_VERSION: ${{ matrix.vscode }}
        # Linux 上 Electron 需要显示器，xvfb 在 ubuntu-latest 镜像里预装。
        run: xvfb-run -a scripts/vscode-e2e.sh

      - name: Job summary (VS Code integration)
        # 渲染逻辑在 `scripts/e2e-summary.py`（YAML 的多行 heredoc 会把终止符缩进掉，
        # 所以不在 workflow 里写 python 内联脚本）；本地同一条命令也能看。
        if: always()
        shell: bash
        run: |
          {
            echo "### VS Code 集成测试 · ${{ matrix.os }} · VS Code ${{ matrix.vscode }}"
            echo
            python3 scripts/e2e-summary.py
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload e2e record (always)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ matrix.os }}-vscode-${{ matrix.vscode }}
          path: docs/e2e/
          include-hidden-files: false
          if-no-files-found: warn

  # macOS 腿（**只 main**）：真宿主差异（`/var`→`/private/var` 符号链接、大小写
  # 不敏感文件系统）只有 macOS 才暴露，值得守；但每个 PR 多 ~10 分钟不划算。
  # 条件只用 `github` 上下文（原因见上面 `e2e` 的注释）。
  e2e-macos:
    needs: changes
    name: e2e (macos-latest · VS Code 1.138.0)
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') && (needs.changes.outputs.rust == 'true' || needs.changes.outputs.editor == 'true')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Setup Node for editor integration tests
        uses: actions/setup-node@v5
        with:
          # @vscode/test-electron 3.x 要求 node >= 22。
          node-version: 22
          cache: npm
          cache-dependency-path: editor/vscode/package-lock.json

      - name: Cache the VS Code download
        uses: actions/cache@v4
        with:
          path: editor/vscode/.vscode-test/vscode-*
          key: vscode-${{ runner.os }}-1.138.0

      - name: Install editor test dependencies
        working-directory: editor/vscode
        run: npm ci --no-fund --no-audit

      - name: Real VS Code integration tests (recorded)
        env:
          SOKO_VSCODE_TEST_VERSION: "1.138.0"
        run: scripts/vscode-e2e.sh

      - name: Job summary (VS Code integration)
        if: always()
        shell: bash
        run: |
          {
            echo "### VS Code 集成测试 · macos-latest · VS Code 1.138.0"
            echo
            python3 scripts/e2e-summary.py
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload e2e record (always)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-macos-latest-vscode-1.138.0
          path: docs/e2e/
          include-hidden-files: false
          if-no-files-found: warn

  # 台账回提交（**只 main**）：矩阵各腿把 `docs/e2e/` 传成 artifact，这里**一次**
  # 合并成一条提交——多腿各自提交会同时改同一个 ledger.jsonl（互相覆盖/冲突）。
  # 用 GITHUB_TOKEN 推的提交不会再触发 workflow（防递归规则），所以不会自激。
  e2e-ledger:
    name: e2e ledger (commit back on main)
    needs: [e2e, e2e-macos]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # 回提交后要给它补一条 commit status：GITHUB_TOKEN 推的提交**不触发** workflow，
      # 因而没有任何 check-run，仓库首页/main 的 HEAD 会挂着一个黄点
      # （"Expected — Waiting for status to be reported"），看起来像"CI 没成功"。
      # 2026-09-18 实测踩过（两次台账回提交都让 main 的 HEAD 显示 pending）。
      statuses: write
    # 同一时刻只允许一个"写台账"的 job：两次 main push 挨得近时，串行化比抢 push 简单
    # （cancel-in-progress: false —— 不取消正在跑的那次，排队执行）。
    concurrency:
      group: e2e-ledger
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          # rebase 需要我们提交的 parent 对象；默认 depth=1 的浅克隆会 rebase 失败。
          fetch-depth: 0

      - name: Download every leg's e2e record
        uses: actions/download-artifact@v5
        with:
          pattern: e2e-*
          path: /tmp/e2e-artifacts

      - name: Merge into docs/e2e (idempotent)
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          out=$(python3 scripts/e2e-merge.py /tmp/e2e-artifacts)
          echo "$out"
          python3 scripts/e2e-merge.py --check
          subject=$(printf '%s\n' "$out" | sed -n 's/^e2e-merge-subject: //p')
          echo "subject=$subject" >> "$GITHUB_OUTPUT"

      - name: Commit and push when the ledger changed
        shell: bash
        env:
          SUBJECT: ${{ steps.merge.outputs.subject }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add docs/e2e
          if git diff --cached --quiet; then
            echo "::notice::台账没有新条目（重跑或重复），不提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "perf(e2e): 台账 ${GITHUB_SHA:0:7} —— ${SUBJECT:-CI}" \
            -m "由 ci.yml 的 e2e-ledger job 合并各腿 artifact（scripts/e2e-merge.py）。"
          # main 上可能有人刚推过：rebase 后重试（最多 3 次）。都失败才报红——
          # 记账失败值得被看见，但要给出可诊断的信息（rebase 冲突时列出来）。
          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "::notice::e2e 台账已回提交（${SUBJECT:-CI}）"
              # 给刚推的提交补一条状态：它由 GITHUB_TOKEN 推、不会触发 workflow，
              # 没有 check-run 的提交在仓库首页显示 pending（见上面的 permissions 注释）。
              # 这条状态是诚实的：本 job 的 `needs: [e2e, e2e-macos]` 全绿才会走到这里。
              sha=$(git rev-parse HEAD)
              gh api "repos/${GITHUB_REPOSITORY}/statuses/${sha}" \
                -f state=success \
                -f context=e2e-ledger \
                -f description="台账回提交（e2e 各腿全绿）" >/dev/null
              echo "::notice::已为 ${sha:0:7} 补 e2e-ledger 成功状态"
              exit 0
            fi
            echo "::warning::push 失败（第 ${attempt} 次），rebase 后重试"
            if ! git pull --rebase origin "${GITHUB_REF_NAME}"; then
              echo "::error::rebase 冲突——台账文件被别人同时改了（多半是另一次 main push 的台账提交）"
              git status --short | head -20
              git rebase --abort || true
              exit 1
            fi
            sleep $((attempt * 3))
          done
          echo "::error::e2e 台账回提交失败（3 次尝试）；重跑本 job 即可"
          exit 1
