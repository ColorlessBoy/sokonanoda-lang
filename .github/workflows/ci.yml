name: ci

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: "rustfmt, clippy"

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Format check (teaching crates)
        # crates/kernel 冻结快照使用 nightly-only rustfmt 配置，stable
        # rustfmt 无法稳定复现；fmt 门禁先覆盖教学 crates（kernel 见
        # docs/architecture.md §6）。
        run: cargo fmt -p sokonanoda-front -p sokonanoda-cli -p sokonanoda-lsp -- --check

      - name: Clippy
        # 严格度由教学 crates 各自的 [lints.rust] warnings = "deny" 注入；
        # kernel 的上游遗留 lint 保持 warning 级（冻结快照原则）。
        run: cargo clippy --workspace --all-targets

  # 自动打 tag + 触发发布：main 上 lint/test 全绿后，若 Cargo.toml 的版本
  # 还没有对应的 v* tag，就打 tag 并 workflow_dispatch release.yml。
  #
  # 为什么两步而不是只推 tag：用 GITHUB_TOKEN 推的 tag **不会**触发其它
  # workflow（GitHub 的防递归规则），所以推完 tag 还要显式 dispatch——
  # workflow_dispatch 恰是这条规则的例外，GITHUB_TOKEN 触发它有效。
  # 幂等：tag 已存在就跳过（版本号没变时每个 push 都不会重复发布）。
  auto-tag:
    needs: [lint, test, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # workflow_dispatch 需要它（403 "Resource not accessible by
      # integration" 的教训：只给 contents: write 时 gh workflow run 被拒）。
      actions: write
    steps:
      - uses: actions/checkout@v5
      - name: Tag v$VERSION when it does not exist yet, then dispatch release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cargo_version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          ext_version=$(python3 -c "import json;print(json.load(open('editor/vscode/package.json'))['version'])")
          if [ "$cargo_version" != "$ext_version" ]; then
            echo "::error::Cargo.toml ($cargo_version) and editor/vscode/package.json ($ext_version) disagree; the version contract (docs/RELEASE.md §2) requires both before tagging."
            exit 1
          fi
          tag="v${cargo_version}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "::notice::tag ${tag} already exists — nothing to release."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$tag"
          git push origin "refs/tags/${tag}"
          gh workflow run release.yml --ref "$tag"
          echo "::notice::tagged ${tag} and dispatched release.yml"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Workspace tests
        # tee 保留完整输出；--no-fail-fast 让所有失败一次暴露。
        # 失败时把完整日志作为 artifact 上传（公开仓库也能从 run 页下载），
        # 避免「CI 红了但拿不到日志」的排查死角（2026-09-13 实况）。
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --locked --no-fail-fast 2>&1 | tee /tmp/cargo-test.log
      # 注解走 check-runs API，**无需鉴权即可公开读取**（logs/artifact 都要
      # token）——这是无 gh/token 环境下唯一的自服务诊断通道。
      - name: Surface failing tests as annotations
        if: failure()
        shell: bash
        run: |
          grep -E "^test .* FAILED$" /tmp/cargo-test.log | while read -r line; do
            echo "::error::$line"
          done
          grep -E "^error(\[E[0-9]+\])?:" /tmp/cargo-test.log | head -20 | while read -r line; do
            echo "::error::$line"
          done
      - name: Upload test log (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cargo-test-log
          path: /tmp/cargo-test.log
          include-hidden-files: false

      - name: Protocol conformance (--json events)
        run: cargo test -p sokonanoda-cli --test protocol --locked

      # 性能例行化（I13-S5c）：每次 push 产出性能报告 artifact——阈值断言
      # 已在上面 Workspace tests 里把红（回归即失败），这一步额外留档：
      # 报告带版本 + commit SHA，按版本可追溯「哪个改动引入了性能回退」。
      - name: Performance report
        run: |
          set -o pipefail
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          out="perf-report-v${version}-$(git rev-parse --short HEAD).txt"
          {
            echo "# sokonanoda perf report"
            echo "version: v${version}  commit: $(git rev-parse HEAD)  date: $(date -u +%FT%TZ)"
            echo "# 阈值断言（scaling ratio / latency）在 Workspace tests 里强制执行；"
            echo "# 下面是本轮实测值（front = 编译器内核路径，lsp = 编辑器交互路径）。"
            echo ""
            echo "## compiler (crates/front/tests/perf.rs)"
            cargo test -p sokonanoda-front --test perf -- --nocapture 2>&1 | grep "^PERF" || true
            echo ""
            echo "## lsp interaction (crates/lsp/src/tests/perf.rs perf_*)"
            cargo test -p sokonanoda-lsp --lib -- perf_ --nocapture 2>&1 | grep "^PERF" || true
            echo ""
            echo "## compiler — project closure (crates/front/tests/perf_project.rs)"
            cargo test -p sokonanoda-front --test perf_project --locked -- --nocapture 2>&1 | grep "^PERF" || true
            echo ""
            echo "## cli — project end-to-end, release binary (crates/cli/tests/perf_project.rs)"
            cargo test -q --release -p sokonanoda-cli --test perf_project --locked -- --nocapture 2>&1 | grep "^PERF" || true
            echo ""
            echo "## extension host wiring (editor/vscode/test-extension-host.js)"
            node editor/vscode/test-extension-host.js 2>&1 | tail -1 || true
          } | tee "$out"
          echo "PERF report written: $out"

      - name: Upload perf report
        uses: actions/upload-artifact@v7
        with:
          name: perf-report
          path: perf-report-*.txt
          include-hidden-files: false

      - name: Lesson corpus is valid
        run: |
          for f in examples/*.sokonanoda; do
            echo "checking $f"
            cargo run -q -p sokonanoda-cli --bin sokonanoda -- "$f" >/dev/null
          done

      - name: Course layer is guarded (canvases, solutions, course.json)
        run: cargo test -p sokonanoda-cli --test course --locked

      - name: Machine events are well-formed JSON
        run: |
          printf 'def id : Prop -> Prop := fun (x : Prop) => x\n#check id\n' \
            | cargo run -q -p sokonanoda-cli --bin sokonanoda -- --json \
            | python3 -c 'import json,sys; [json.loads(l) for l in sys.stdin]'

      - name: Build server + CLI for editor integration tests
        # editor/vscode 的集成测试不自己构建：它只发现 target/ 下的二进制
        # （extension.js 的自动发现逻辑），所以必须先构建两者。
        run: cargo build -p sokonanoda-lsp -p sokonanoda-cli --locked

      - name: Stage bundled binaries (VSIX layout)
        # 按打包布局 stage 到 bin/<target>/：bundled 解析优先于 target/ 发现，
        # 因此集成测试验证的就是用户安装平台包后的那条路径（LSP + CLI）。
        run: node editor/vscode/scripts/stage-lsp.js --profile debug

      - name: Setup Node for editor integration tests
        uses: actions/setup-node@v5
        with:
          # @vscode/test-electron 3.x 要求 node >= 22。
          node-version: 22
          cache: npm
          cache-dependency-path: editor/vscode/package-lock.json

      - name: Install editor test dependencies
        working-directory: editor/vscode
        run: npm ci --no-fund --no-audit

      - name: Download + resolution logic unit tests
        # 纯 Node.js 单元测试：server.js 的 bundled 解析/版本锁定 URL/平台映射，
        # 以及 followRedirects 与 tar 解压逻辑；不依赖 Rust / VS Code，秒级完成。
        working-directory: editor/vscode
        run: npm run test:unit

      - name: Package host VSIX (bundled payload smoke)
        # 每次 CI 都走一遍真实打包：断言 bin/<target>/ 在包里且可执行位正确
        # （exec 位只能在 Linux/macOS 打包时保留）。发布 dry-run 之外的第一道闸。
        working-directory: editor/vscode
        run: |
          npx --yes @vscode/vsce package --target linux-x64 --out /tmp/host.vsix
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile("/tmp/host.vsix") as zf:
              manifest = zf.read("extension.vsixmanifest").decode()
              assert 'TargetPlatform="linux-x64"' in manifest
              for base in ["sokonanoda-lsp", "sokonanoda"]:
                  name = f"extension/bin/linux-x64/{base}"
                  info = zf.getinfo(name)
                  mode = (info.external_attr >> 16) & 0o777
                  assert info.file_size > 1_000_000, (name, info.file_size)
                  assert mode & 0o111, (name, oct(mode))
                  print(f"host VSIX ok: {name} mode={oct(mode)} size={info.file_size}")
          PY

      # 真 VS Code 集成测试已移到独立的 `e2e` job（多 OS/多版本矩阵 + 留档），
      # 见文件末尾：它跑的是 `scripts/vscode-e2e.sh`（构建 release + stage +
      # 真宿主 + 记账），并用 `needs` 卡住 auto-tag。

  # 真 VS Code 集成测试（e2e）：与本地例行同一条命令
  # （`scripts/vscode-e2e.sh` = 构建 release → stage → 真宿主 → 记
  # `docs/e2e/`），矩阵覆盖 Linux（xvfb）/macOS 与**声明的最低 VS Code 版本**
  # + 当前稳定版。结果进 job summary 与 artifact（CI 不回提交仓库）。
  e2e:
    name: e2e (${{ matrix.os }} · VS Code ${{ matrix.vscode }})
    runs-on: ${{ matrix.os }}
    # PR/分支 push：只跑 Ubuntu（快反馈，等价于本地例行）；
    # main 的 push：加跑 macOS 腿（真宿主差异：/var→/private/var 符号链接、
    # 大小写不敏感文件系统——这些只有 macOS 才暴露；每个 PR 都跑不划算）。
    if: >-
      matrix.os != 'macos-latest'
      || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            vscode: "1.138.0"
            launcher: xvfb-run -a
          - os: macos-latest
            vscode: "1.138.0"
            launcher: ""
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Setup Node for editor integration tests
        uses: actions/setup-node@v5
        with:
          # @vscode/test-electron 3.x 要求 node >= 22。
          node-version: 22
          cache: npm
          cache-dependency-path: editor/vscode/package-lock.json

      - name: Cache the VS Code download
        # 每个版本 ~300MB/平台；钉住版本后这份缓存长期有效（key 含 OS 与版本）。
        # 只缓存 VS Code 本体（`vscode-*`），不缓存 user-data（测试状态每次干净）。
        uses: actions/cache@v4
        with:
          path: editor/vscode/.vscode-test/vscode-*
          key: vscode-${{ runner.os }}-${{ matrix.vscode }}

      - name: Install editor test dependencies
        working-directory: editor/vscode
        run: npm ci --no-fund --no-audit

      - name: Real VS Code integration tests (recorded)
        # 与本地同一条命令：构建 release（被测即发布形态）→ stage 到
        # bin/<target>/ → vscode-test → docs/e2e/{ledger.jsonl,latest.json,logs}。
        # Linux 上 Electron 需要显示器，xvfb 在 ubuntu-latest 镜像里预装。
        env:
          SOKO_VSCODE_TEST_VERSION: ${{ matrix.vscode }}
        run: ${{ matrix.launcher }} scripts/vscode-e2e.sh

      - name: Job summary (VS Code integration)
        # 渲染逻辑在 `scripts/e2e-summary.py`（YAML 的多行 heredoc 会把终止符缩进掉，
        # 所以不在 workflow 里写 python 内联脚本）；本地同一条命令也能看。
        if: always()
        shell: bash
        run: |
          {
            echo "### VS Code 集成测试 · ${{ matrix.os }} · VS Code ${{ matrix.vscode }}"
            echo
            python3 scripts/e2e-summary.py
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload e2e record (always)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ matrix.os }}-vscode-${{ matrix.vscode }}
          path: docs/e2e/
          include-hidden-files: false
          if-no-files-found: warn
