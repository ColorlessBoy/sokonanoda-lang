  lint-clippy:
    name: lint-clippy（clippy 全量 check）
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
    # `clippy` 留在自己这条 ✓（它要**全量 check** ✓ ⇒ 只有它需要 Rust cache ✓）。
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: "rustfmt, clippy"

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Clippy
        # 严格度由教学 crates 各自的 [lints.rust] warnings = "deny" 注入；
        # kernel 的上游遗留 lint 保持 warning 级（冻结快照原则）。
        run: cargo clippy --workspace --all-targets

  # 自动打 tag + 触发发布：main 上 lint/test 全绿后，若 Cargo.toml 的版本
  # 还没有对应的 v* tag，就打 tag 并 workflow_dispatch release.yml。
  #
  # 为什么两步而不是只推 tag：用 GITHUB_TOKEN 推的 tag **不会**触发其它
  # workflow（GitHub 的防递归规则），所以推完 tag 还要显式 dispatch——
  # workflow_dispatch 恰是这条规则的例外，GITHUB_TOKEN 触发它有效。
  # 幂等：tag 已存在就跳过（版本号没变时每个 push 都不会重复发布）。
  auto-tag:
    # ⚠ `queue-lint` 在这里**不是装饰** ✗（2026-10-15，洞 `LEDGER-JOB-SKIPPED-ON-DOC-ONLY-PUSH`）：
    # 队列门禁原先由 `ledger` 顶着（`ledger` 在 `needs` 里 ✓）⇒ 搬去独立 job 后，
    # **不补这一条就等于把"队列不一致不许发版"这道闸悄悄拆掉** ✗ —— 门禁强度必须**不变** ✓。
    needs: [lint-fmt, lint-clippy, board, guard-bite, budgets, site, hygiene, test, gates-fast, gates-course, ledger, contract, editor, e2e, e2e-macos]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # workflow_dispatch 需要它（403 "Resource not accessible by
      # integration" 的教训：只给 contents: write 时 gh workflow run 被拒）。
      actions: write
    steps:
      - uses: actions/checkout@v5
      - name: Tag v$VERSION when it does not exist yet, then dispatch release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cargo_version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          ext_version=$(python3 -c "import json;print(json.load(open('editor/vscode/package.json'))['version'])")
          if [ "$cargo_version" != "$ext_version" ]; then
            echo "::error::Cargo.toml ($cargo_version) and editor/vscode/package.json ($ext_version) disagree; the version contract (docs/RELEASE.md §2) requires both before tagging."
            exit 1
          fi
          tag="v${cargo_version}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "::notice::tag ${tag} already exists — nothing to release."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$tag"
          git push origin "refs/tags/${tag}"
          gh workflow run release.yml --ref "$tag"
          echo "::notice::tagged ${tag} and dispatched release.yml"

