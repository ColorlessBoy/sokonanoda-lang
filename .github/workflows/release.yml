name: release

permissions:
  contents: read

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# 发布 = per-target VSIX（内嵌对应平台 LSP）+ 一个 universal 回退包（无 bin，
# 用版本锁定的下载兜底）+ GitHub Release 资产（tarball 供回退下载）。
# 设计：docs/design-bundled-lsp.md §3.3。四条铁律：
#   1. exec 位必须在 Linux 上打包（Windows 打包会丢 unix mode）；
#   2. tag、Cargo.toml、package.json 版本必须一致（版本门禁）；
#   3. 下载 URL 锁定 v${version}，永不 latest；
#   4. Linux 目标一律 cargo-zigbuild + 显式 glibc 2.28 地板（VS Code 自己的
#      Linux 最低要求；ubuntu-latest 原生构建会引入 2.39 依赖）。musl 目标
#      （alpine-*）由 Zig 静态链接，win32-arm64 在 windows-latest 原生构建。
jobs:
  # 1) 每个平台构建 LSP 二进制（供 VSIX 内嵌 + GitHub Release tarball）。
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,   target: aarch64-apple-darwin,       tool: cargo, glibc: "" }
          - { os: macos-latest,   target: x86_64-apple-darwin,        tool: cargo, glibc: "" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,     tool: cargo, glibc: "" }
          - { os: windows-latest, target: aarch64-pc-windows-msvc,    tool: cargo, glibc: "" }
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu,   tool: zig, glibc: ".2.28" }
          - { os: ubuntu-latest,  target: aarch64-unknown-linux-gnu,  tool: zig, glibc: ".2.28" }
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-musl,  tool: zig, glibc: "" }
          - { os: ubuntu-latest,  target: aarch64-unknown-linux-musl, tool: zig, glibc: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # Zig + cargo-zigbuild 只用于 Linux 目标；版本钉死避免工具链漂移。
      - if: matrix.tool == 'zig'
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"
          cache-key: ${{ matrix.target }}
      - if: matrix.tool == 'zig'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild@0.23.4
      - uses: Swatinem/rust-cache@v2
        with:
          # 默认缓存 key 不含 target triple：矩阵各 leg 必须显式区分。
          key: ${{ matrix.target }}${{ matrix.glibc }}
      - name: Build binaries (LSP server + CLI)
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.tool }}" = "zig" ]; then
            cargo zigbuild --release --locked -p sokonanoda-lsp -p sokonanoda-cli \
              --target "${{ matrix.target }}${{ matrix.glibc }}"
          else
            cargo build --release --locked -p sokonanoda-lsp -p sokonanoda-cli \
              --target "${{ matrix.target }}"
          fi
      - name: Verify glibc floor <= 2.28 (linux gnu)
        if: matrix.tool == 'zig' && !contains(matrix.target, 'musl')
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/sokonanoda-lsp"
          max=$(readelf -W --version-info --dyn-syms "$bin" \
            | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1)
          echo "highest required symbol: ${max}"
          test "$(printf '%s\n' "$max" "GLIBC_2.28" | sort -V | tail -1)" = "GLIBC_2.28"
      - name: Verify static musl binary
        if: contains(matrix.target, 'musl')
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/sokonanoda-lsp"
          # 注意 `set -o pipefail` + `ldd`（静态二进制退出码 1）：不能直接
          # `ldd | grep`，否则管道恒失败（dry-run 踩过，见 CI-FAILURES.md）。
          file "$bin" | grep -q "statically linked" \
            || { file "$bin"; echo "expected a statically linked musl binary"; exit 1; }
          ldd_out=$(ldd "$bin" 2>&1 || true)
          echo "$ldd_out"
          grep -q "not a dynamic executable" <<< "$ldd_out" \
            || { echo "expected ldd to report a static binary"; exit 1; }
      - name: Package binaries
        shell: bash
        run: |
          mkdir -p dist-lsp dist-cli
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            cp "target/${{ matrix.target }}/release/sokonanoda-lsp.exe" dist-lsp/
            cp "target/${{ matrix.target }}/release/sokonanoda.exe" dist-cli/
          else
            cp "target/${{ matrix.target }}/release/sokonanoda-lsp" dist-lsp/
            cp "target/${{ matrix.target }}/release/sokonanoda" dist-cli/
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: lsp-${{ matrix.target }}
          path: dist-lsp/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: dist-cli/
          if-no-files-found: error

  # 2) 逐 target stage 二进制 → `vsce package --target`；另出 universal 回退包。
  package-vsix:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editor/vscode/package-lock.json

      - name: Version gate (tag == Cargo.toml == package.json)
        run: |
          set -euo pipefail
          cargo_version=$(sed -n '/^\[workspace.package\]/,/^\[/p' Cargo.toml \
            | sed -n 's/^version = "\(.*\)"/\1/p' | head -1)
          ext_version=$(node -p "require('./editor/vscode/package.json').version")
          test "$cargo_version" = "$ext_version" \
            || { echo "Cargo.toml ($cargo_version) != package.json ($ext_version)"; exit 1; }
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            test "${GITHUB_REF_NAME}" = "v${ext_version}" \
              || { echo "tag ${GITHUB_REF_NAME} != v${ext_version}"; exit 1; }
          fi
          echo "version gate ok: v${ext_version}"

      # v4 按 artifact 名各建一个目录：lsp-<rust-target>/ 与 cli-<rust-target>/。
      - name: Download per-platform binaries
        uses: actions/download-artifact@v4
        with:
          pattern: "{lsp,cli}-*"

      - name: Install extension dependencies
        working-directory: editor/vscode
        run: npm ci --no-fund --no-audit

      - name: Package platform-specific VSIXes
        working-directory: editor/vscode
        run: |
          set -euo pipefail
          mkdir -p dist
          for entry in \
            "x86_64-unknown-linux-gnu:linux-x64" \
            "aarch64-unknown-linux-gnu:linux-arm64" \
            "x86_64-unknown-linux-musl:alpine-x64" \
            "aarch64-unknown-linux-musl:alpine-arm64" \
            "aarch64-apple-darwin:darwin-arm64" \
            "x86_64-apple-darwin:darwin-x64" \
            "x86_64-pc-windows-msvc:win32-x64" \
            "aarch64-pc-windows-msvc:win32-arm64"
          do
            rust="${entry%%:*}"; vsce="${entry##*:}"
            exe=""; [[ "$rust" == *windows* ]] && exe=".exe"
            # 相对路径从 editor/vscode 出发：仓库根是 ../../（少一层 ../ 会
            # 落到 editor/ 下，dry-run 曾因此 ENOENT，见 CI-FAILURES.md）。
            node scripts/stage-lsp.js \
              --rust-target "$rust" \
              --binary "../../lsp-${rust}/sokonanoda-lsp${exe}" \
              --cli-binary "../../cli-${rust}/sokonanoda${exe}"
            npx --yes @vscode/vsce package --target "$vsce" \
              --out "dist/sokonanoda-${vsce}.vsix"
          done

      - name: Package universal fallback VSIX (no bundled binary)
        working-directory: editor/vscode
        run: |
          mkdir -p dist
          npm run clean:lsp
          npx --yes @vscode/vsce package --out dist/sokonanoda-universal.vsix

      - name: VSIX smoke test (payload + exec bits + target manifest)
        working-directory: editor/vscode
        run: |
          python3 - <<'PY'
          import zipfile

          # (vsce target, bundled base names) — the VSIX carries BOTH the LSP
          # server and the `sokonanoda` CLI for the same platform.
          EXPECTED = {
              "dist/sokonanoda-linux-x64.vsix": ("linux-x64", ["sokonanoda-lsp", "sokonanoda"]),
              "dist/sokonanoda-linux-arm64.vsix": ("linux-arm64", ["sokonanoda-lsp", "sokonanoda"]),
              "dist/sokonanoda-alpine-x64.vsix": ("alpine-x64", ["sokonanoda-lsp", "sokonanoda"]),
              "dist/sokonanoda-alpine-arm64.vsix": ("alpine-arm64", ["sokonanoda-lsp", "sokonanoda"]),
              "dist/sokonanoda-darwin-arm64.vsix": ("darwin-arm64", ["sokonanoda-lsp", "sokonanoda"]),
              "dist/sokonanoda-darwin-x64.vsix": ("darwin-x64", ["sokonanoda-lsp", "sokonanoda"]),
              "dist/sokonanoda-win32-x64.vsix": ("win32-x64", ["sokonanoda-lsp", "sokonanoda"]),
              "dist/sokonanoda-win32-arm64.vsix": ("win32-arm64", ["sokonanoda-lsp", "sokonanoda"]),
          }
          universal = "dist/sokonanoda-universal.vsix"

          for path, (target, bases) in EXPECTED.items():
              with zipfile.ZipFile(path) as zf:
                  names = zf.namelist()
                  manifest = zf.read("extension.vsixmanifest").decode("utf-8", "replace")
                  assert f'TargetPlatform="{target}"' in manifest, f"{path}: manifest lacks TargetPlatform={target}"
                  for base in bases:
                      binary = f"extension/bin/{target}/{base}" + (".exe" if target.startswith("win32") else "")
                      assert binary in names, f"{path}: missing {binary}"
                      info = zf.getinfo(binary)
                      mode = (info.external_attr >> 16) & 0o777
                      assert info.file_size > 1_000_000, f"{path}: suspiciously small binary ({info.file_size} B)"
                      if not target.startswith("win32"):
                          assert mode & 0o111, f"{path}: {binary} is not executable (mode={oct(mode)})"
                      print(f"ok {path}: {binary} mode={oct(mode)} size={info.file_size}")

          with zipfile.ZipFile(universal) as zf:
              assert not any(n.startswith("extension/bin/") for n in zf.namelist()), \
                  f"{universal}: fallback package must not embed a platform binary"
              assert "extension.vsixmanifest" in zf.namelist()
              print(f"ok {universal}: no bundled binary")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: sokonanoda-vsix
          path: editor/vscode/dist/*.vsix
          if-no-files-found: error

  # 3) GitHub Release：平台 tarball（回退下载资产）+ 全部 VSIX。
  github-release:
    needs: [build, package-vsix]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # v4 不带 name 时按 artifact 名各建一个目录：
      # lsp-<target>/ 二进制、sokonanoda-vsix/*.vsix。
      - uses: actions/download-artifact@v4
      - name: Create release and upload all artifacts
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create "${{ github.ref_name }}" \
            --title "sokonanoda ${{ github.ref_name }}" \
            --generate-notes || true
          # 平台二进制 tarball：universal VSIX 的版本锁定下载回退 + agent /
          # headless 直接执行（LSP 与 CLI 各自一个 tarball）。artifact 上传/下载
          # 会丢 unix mode（0644），必须在 tar 前补回并断言（v0.9.0 曾因此
          # 解出不可执行的二进制）。
          for dir in lsp-*/; do
            target="${dir#lsp-}"
            target="${target%/}"
            exe=""; [[ "$target" == *windows* ]] && exe=".exe"
            chmod +x "${dir}sokonanoda-lsp${exe}"
            tar czf "sokonanoda-lsp-${target}.tar.gz" -C "$dir" .
            tar tzvf "sokonanoda-lsp-${target}.tar.gz" | grep -q '^-rwx' \
              || { echo "exec bit missing in sokonanoda-lsp-${target}.tar.gz"; exit 1; }
            gh release upload "${{ github.ref_name }}" \
              "sokonanoda-lsp-${target}.tar.gz" --clobber
          done
          for dir in cli-*/; do
            target="${dir#cli-}"
            target="${target%/}"
            exe=""; [[ "$target" == *windows* ]] && exe=".exe"
            chmod +x "${dir}sokonanoda${exe}"
            tar czf "sokonanoda-cli-${target}.tar.gz" -C "$dir" .
            tar tzvf "sokonanoda-cli-${target}.tar.gz" | grep -q '^-rwx' \
              || { echo "exec bit missing in sokonanoda-cli-${target}.tar.gz"; exit 1; }
            gh release upload "${{ github.ref_name }}" \
              "sokonanoda-cli-${target}.tar.gz" --clobber
          done
          for vsix in sokonanoda-vsix/*.vsix; do
            gh release upload "${{ github.ref_name }}" "$vsix" --clobber
          done

  # 4) Marketplace：先 universal 回退包，再逐 target 平台包。
  #    Azure 端点间歇超时（CI 台账多次记录），每个包独立重试 4 次；
  #    `--skip-duplicate` 保证 tag 重跑幂等。
  marketplace-publish:
    needs: [package-vsix]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download VSIXes
        uses: actions/download-artifact@v4
        with:
          name: sokonanoda-vsix
      - name: Publish to VS Code Marketplace
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          for vsix in \
            sokonanoda-universal.vsix \
            sokonanoda-linux-x64.vsix \
            sokonanoda-linux-arm64.vsix \
            sokonanoda-alpine-x64.vsix \
            sokonanoda-alpine-arm64.vsix \
            sokonanoda-darwin-arm64.vsix \
            sokonanoda-darwin-x64.vsix \
            sokonanoda-win32-x64.vsix \
            sokonanoda-win32-arm64.vsix
          do
            echo "publishing ${vsix}"
            published=0
            for attempt in 1 2 3 4; do
              if npx --yes @vscode/vsce publish --skip-duplicate --packagePath "$vsix"; then
                published=1
                break
              fi
              echo "vsce publish ${vsix} attempt ${attempt} failed; retrying in 30s..."
              sleep 30
            done
            test "$published" = "1" || { echo "failed to publish ${vsix}"; exit 1; }
          done
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
