name: release

permissions:
  contents: read

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu }
          - { os: macos-latest,   target: aarch64-apple-darwin }
          - { os: macos-latest,   target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build LSP server
        run: cargo build --release --locked -p sokonanoda-lsp --target ${{ matrix.target }}
      - name: Package binary
        shell: bash
        run: |
          mkdir -p dist
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            cp "target/${{ matrix.target }}/release/sokonanoda-lsp.exe" dist/
          else
            cp "target/${{ matrix.target }}/release/sokonanoda-lsp" dist/
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: lsp-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  vsix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editor/vscode/package-lock.json
      - name: Package VS Code extension
        working-directory: editor/vscode
        run: |
          npm ci
          npx --yes @vscode/vsce package --out sokonanoda.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: sokonanoda-vsix
          path: editor/vscode/sokonanoda.vsix

  # LSP 二进制 + VSIX 挂 GitHub Release；VSIX 同时发布到 Marketplace
  github-release:
    needs: [build, vsix]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
      - name: Create release and upload all artifacts
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "sokonanoda ${{ github.ref_name }}" \
            --generate-notes
          for dir in lsp-*/; do
            target="${dir#lsp-}"
            target="${target%/}"
            tar czf "sokonanoda-lsp-${target}.tar.gz" -C "$dir" .
            gh release upload "${{ github.ref_name }}" "sokonanoda-lsp-${target}.tar.gz"
          done
          gh release upload "${{ github.ref_name }}" "vsix/sokonanoda.vsix" --clobber

  # Marketplace 发布（官方 CI 模板：VSCE_PAT secret + vsce publish）
  marketplace-publish:
    needs: [vsix]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download VSIX
        uses: actions/download-artifact@v4
        with:
          name: sokonanoda-vsix
      - name: Publish to VS Code Marketplace
        if: github.event_name == 'push'
        run: npx --yes @vscode/vsce publish --skip-duplicate --packagePath sokonanoda.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
