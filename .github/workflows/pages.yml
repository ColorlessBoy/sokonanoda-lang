name: pages

# 项目官网（GitHub Pages）：零构建静态 `site/` + 官方 Pages actions。
#
# **站点只有一个页面**（2026-09-21 简化，设计 `docs/design/site-single-page.md`）：
# 是什么 / 怎么安装 / 核心特点 / 未来的计划。它取代了 2026-09-20 那次 28 页重构
# ——那次的信息架构、导航生成器、搜索索引、走查数据、诊断码表页都已删除，
# 因为「没有对象可查」的检查只会腐烂成噪声。
#
# 为什么不用 `docs/` 作 Pages 源：那里是开发者台账（含 CI 失败记录与内部取舍），
# 发布它等于把研发内账挂上公网；且分支部署有 Jekyll 隐式渲染与 10 次构建/小时的
# 限制。Actions 部署两者皆免。
#
# 版本号**一律不手写**：`scripts/gen-site-data.py` 从**最新的已发布 tag** 生成
# `site/data/site.json`，页面上的版本号与下载链接由 `assets/site.js` 从它回填。
#
# **一次性前置动作（只能由仓库拥有者做）**：Settings → Pages 把 Source 设为
# GitHub Actions。创建 Pages 站点需要仓库管理员权限，GITHUB_TOKEN 的
# `pages: write` 只够部署**已启用**的站点（configure-pages 的 `enablement:
# true` 实测也建不了）。未启用时本 workflow 会礼貌跳过并留下 notice，而不是
# 把 CI 刷红；启用之后无需再改代码，下一次 push 自动部署。

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/gen-site-data.py"   # site.json：已发布版本
      - "scripts/check-site.py"      # 总验收（10 项）
      - ".github/workflows/pages.yml"
  # 发布一个新 release 之后刷新站点（站点写的是**已发布版本**的事实）。
  #
  # ⚠️ **它对自动发版不生效**：release 由 `release.yml` 用 `GITHUB_TOKEN` 创建，
  # 而 GITHUB_TOKEN 触发的事件**不会**再触发其它 workflow（GitHub 的防递归规则，
  # 与本仓 auto-tag 那条注释同一个坑）。2026-09-21 实测：v0.62.0 发布成功后
  # 这里一次都没有被触发。
  # 所以**发布后刷新站点的真正机制是 `docs/RELEASE.md` §6.5 那两步**
  # （重跑 `gen-site-data.py` 并提交 `site/data/site.json`）——提交会改到
  # `site/**`，那一推才是这个 workflow 的触发器。
  # 这一条留着是为了**人工**在 UI 上发布 release 的场合（那种事件不是 bot 发的）。
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # `fetch-depth: 0` **是必需的，不是优化**：站点写的是已发布版本的事实，
      # 而"已发布"的定义就是最新的 `vX.Y.Z` tag。默认的浅克隆（depth 1）不带
      # tag，生成器便解析不出发布版本，只能拒绝写入（exit 3）——那是**故意的**，
      # 比"沿用上次的值、正确但全靠运气"要好。
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # 门禁：Pages 未启用时跳过其余步骤（见文件头说明）。
      #
      # **必须走鉴权的 gh api**，不能用裸 curl：未鉴权的 GET /pages 会 401/404
      # （限流或权限），曾经让门禁误判 enabled=false → 部署步骤全被跳过、
      # 站点迟迟不上线（2026-09-13 实况：三次「成功」的 run 里部署全是
      # skipped）。runner 自带 gh，GITHUB_TOKEN 天然可用。
      - name: Gate on Pages being enabled
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" > /tmp/pages.json 2>&1; then
            echo "enabled=true"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::GitHub Pages 尚未启用：到 Settings → Pages 把 Source 设为 GitHub Actions 后重跑本 workflow。"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate site data (python3 stdlib only — no new toolchain)
        if: steps.gate.outputs.enabled == 'true'
        run: python3 scripts/gen-site-data.py

      # 总验收：结构 / 链接 / 无写死版本号 / 元数据 / 体积 / 已发布版本一致，
      # 共 10 项，exit 0 才算过。渲染实跑（`--browser`，要 Chrome）留在本地：
      # 单页站点的资源引用与 DOM 回填已被上面的静态检查覆盖，runner 上装 Chrome
      # 的收益不如把这一步留给发布前的人工门禁
      # （本地：`python3 scripts/check-site.py --browser`）。
      - name: Site acceptance
        if: steps.gate.outputs.enabled == 'true'
        run: python3 scripts/check-site.py

      - uses: actions/configure-pages@v5
        if: steps.gate.outputs.enabled == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.gate.outputs.enabled == 'true'
        with:
          path: site

      - id: deployment
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
