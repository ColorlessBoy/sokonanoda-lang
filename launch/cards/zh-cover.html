<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Sokonanoda — 中文封面</title>
<link rel="stylesheet" href="base.css">
<style>
  body { width: 1200px; height: 630px; }
  .top { position: absolute; top: 38px; left: 48px; right: 48px; }
  .row { display: flex; align-items: baseline; justify-content: space-between; }
  .ver { font-family: var(--font-mono); font-size: 13px; color: var(--acc); letter-spacing: 0.06em; }
  h1 { font-size: 44px; margin-top: 14px; font-family: var(--font-serif); }
  .sub { margin-top: 10px; font-size: 20px; max-width: 1060px; line-height: 1.5; }
  .badges { margin-top: 12px; }
  .shot { left: 48px; right: 48px; bottom: 18px; height: 350px; }
  .shot img { width: 1104px; }
  .credit { position: absolute; right: 48px; bottom: 380px; font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); }
</style>
</head>
<body>
<div class="root">
  <div class="top">
    <div class="row">
      <div class="eyebrow">Sokonanoda <span class="dot">·</span> 形式化证明教学语言</div>
      <div class="ver">v0.100.0 · 开源</div>
    </div>
    <h1>像写数学证明那样，<br>一句一句写。</h1>
    <p class="sub">目标实时可见，写错内核告诉你。装一个 VS Code 插件就能开始 —— 不用 Lean、不用 Rust。</p>
  </div>
  <div class="credit">真实 VS Code 画面 · 已发布插件 v0.100.0</div>
  <div class="shot"><img src="../../site/assets/hero-vscode.png" alt=""></div>
</div>
</body>
</html>
