[workspace]
members = ["crates/kernel", "crates/front", "crates/cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[profile.release]
opt-level = 3
overflow-checks = false
lto = "fat"
codegen-units = 1

[profile.test]
opt-level = 3
overflow-checks = true
