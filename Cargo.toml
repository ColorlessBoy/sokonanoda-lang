[workspace]
members = ["crates/kernel", "crates/front", "crates/cli", "crates/lsp"]
resolver = "2"

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "Apache-2.0"
# 跟随最新 stable（docs/RELEASE.md：发布前用当前 stable 校准）。
rust-version = "1.96"


[profile.release]
opt-level = 3
overflow-checks = false
lto = "fat"
codegen-units = 1

[profile.test]
opt-level = 3
overflow-checks = true
