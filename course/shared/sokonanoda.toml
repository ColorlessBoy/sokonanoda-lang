# sokonanoda.toml —— 课程语料的**共享库子项目**（模块根 = 本目录）。
#
# 为什么单独一个子项目：
#   * 学习画布（course/unitN-*.sokonanoda）**故意各自自给自足**——学习者打开
#     一个文件就能看到全部前置声明，不需要追 import；golden/镜像/课程树也都
#     按"一单元一文件"钉着。
#   * 但同几段声明在多个单元里逐字重复（And 公理 12 份、显式 Nat 块 4 份），
#     改一处漏一处没有任何测试能发现（事件计数只看得见语义变化）。
#   * 于是把**规范文本**放在这里（可 import、可单独判卷），并由
#     `crates/cli/tests/course_shared.rs` 守住"每个单元里的副本与它逐字一致"。
#     画布不 import 这里的东西——它们是同一段文本的两份载体，测试负责不让它们漂移。
#
# Demo.sokonanoda 是这个子项目的自检入口：它**真的** import 两个模块并判卷。
name = "course-shared"
requires = "0.65.0"
